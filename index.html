<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Arise Kage — the fitness app that levels you up for real. Track workouts, water, nutrition, and progress photos. 100% free, forever.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arise Kage">
<title>Arise Kage — Level Up. For Real.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c3aed'/%3E%3Cpath d='M30 70 L50 25 L70 70 M38 55 L62 55' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style id="app-styles">
/* ====================================================================
   ARISE KAGE — Core Stylesheet
   ==================================================================== */
:root{
  --bg-0:#0a0a12; --bg-1:#111120; --bg-2:#191a2e; --bg-3:#22243d;
  --surface:#15162a; --surface-hi:#1e2038;
  --border:#2c2e4a; --border-hi:#3d3f66;
  --text-0:#f4f3ff; --text-1:#c7c6e6; --text-2:#8b89ad; --text-3:#5c5a80;
  --accent:#7c3aed; --accent-2:#a78bfa; --accent-glow:#7c3aedaa;
  --danger:#f43f5e; --warn:#f59e0b; --good:#22d3aa; --info:#38bdf8;
  --water:#38bdf8; --xp:#a78bfa; --fire:#fb923c;
  --rank-e:#8b89ad; --rank-d:#38bdf8; --rank-c:#22d3aa; --rank-b:#a78bfa; --rank-a:#fb923c; --rank-s:#f43f5e; --rank-ss:#ffd54a;
  --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-xl:32px;
  --shadow-1:0 2px 8px rgba(0,0,0,.25); --shadow-2:0 8px 30px rgba(0,0,0,.4); --shadow-glow:0 0 24px var(--accent-glow);
  --font-display:'Kage Display',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --dur-fast:.15s; --dur-med:.3s; --dur-slow:.6s; --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="kage"]{
  --bg-0:#100905; --bg-1:#1a0f08; --bg-2:#241608; --bg-3:#2e1c0a;
  --surface:#1c1108; --surface-hi:#28180a;
  --border:#3a2410; --border-hi:#4d3115;
  --accent:#ea580c; --accent-2:#fb923c; --accent-glow:#ea580caa; --xp:#fbbf24;
}
:root[data-theme="light"]{
  --bg-0:#f5f4fb; --bg-1:#ffffff; --bg-2:#eeecf9; --bg-3:#e4e1f5;
  --surface:#ffffff; --surface-hi:#f7f6fd;
  --border:#e1def2; --border-hi:#cfc9ea;
  --text-0:#181425; --text-1:#39355a; --text-2:#6b6890; --text-3:#9895b8;
  --accent:#7c3aed; --accent-2:#6d28d9; --accent-glow:#7c3aed55;
  --shadow-1:0 2px 8px rgba(40,30,80,.06); --shadow-2:0 8px 30px rgba(40,30,80,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
:root[data-theme="light"] html{color-scheme:light}
body{
  font-family:var(--font-body);background:var(--bg-0);color:var(--text-0);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;line-height:1.4;
  transition:background var(--dur-med) var(--ease-out),color var(--dur-med) var(--ease-out);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-glow), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, var(--accent-glow), transparent 50%);
  opacity:.35;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
.reduced-motion *{animation-duration:.001s !important;transition-duration:.001s !important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.icon{width:1em;height:1em;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.fill{fill:currentColor;stroke:none}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 14px) 20px 12px;
  background:linear-gradient(var(--bg-0) 60%, transparent);
  backdrop-filter:blur(10px);
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:17px}
.topbar .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-glow)}
.topbar .brand .mark svg{width:18px;height:18px;stroke:#fff}
.topbar .streak{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--fire);background:var(--surface);border:1px solid var(--border);padding:6px 10px;border-radius:999px}
.topbar .streak .icon{width:14px;height:14px}

/* ---------- Main / screens ---------- */
main{flex:1;padding:4px 20px calc(96px + var(--safe-bottom));position:relative}
.screen{display:none;animation:screenIn var(--dur-med) var(--ease-out)}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);font-weight:700;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between}
.section-title .link{color:var(--accent-2);text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer}
h1.page-title{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.page-sub{color:var(--text-2);font-size:14px;margin-bottom:18px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-1)}
.card + .card{margin-top:12px}
.card.tap{cursor:pointer;transition:transform var(--dur-fast) var(--ease-out),border-color var(--dur-fast)}
.card.tap:active{transform:scale(.98)}
.card.tap:hover{border-color:var(--border-hi)}
.card.glow{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:13px 20px;border-radius:var(--radius-md);transition:transform var(--dur-fast) var(--ease-spring),filter var(--dur-fast),box-shadow var(--dur-fast)}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface-hi);border:1px solid var(--border);color:var(--text-0)}
.btn-ghost:hover{border-color:var(--border-hi)}
.btn-danger{background:color-mix(in srgb, var(--danger) 15%, transparent);color:var(--danger);border:1px solid color-mix(in srgb, var(--danger) 40%, transparent)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn-icon{width:44px;height:44px;border-radius:14px;background:var(--surface-hi);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center}
.fab{position:fixed;z-index:35;right:calc(50% - 260px + 20px);bottom:calc(96px + var(--safe-bottom));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 24px var(--accent-glow);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform var(--dur-fast) var(--ease-spring)}
.fab:active{transform:scale(.9) rotate(90deg)}
@media (max-width:559px){.fab{right:24px}}

/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
  background:color-mix(in srgb, var(--bg-1) 88%, transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding:8px 6px calc(8px + var(--safe-bottom));
  display:flex;justify-content:space-around}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-2);font-size:10px;font-weight:700;padding:6px 10px;border-radius:12px;position:relative;transition:color var(--dur-fast)}
.navbtn .icon{width:22px;height:22px;transition:transform var(--dur-fast) var(--ease-spring)}
.navbtn.active{color:var(--accent-2)}
.navbtn.active .icon{transform:translateY(-2px) scale(1.08)}
.navbtn:active .icon{transform:scale(.85)}
.navbtn .dot{position:absolute;top:2px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);display:none}
.navbtn .dot.show{display:block}

/* ---------- Progress / rings ---------- */
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:10}
.ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease-out)}
.ring-center{position:absolute;text-align:center}
.ring-center .val{font-size:22px;font-weight:800;display:block}
.ring-center .lbl{font-size:11px;color:var(--text-2)}

.bar-track{height:10px;border-radius:99px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .8s var(--ease-out);position:relative}
.bar-fill.xp{background:linear-gradient(90deg,var(--xp),#fff)}
.bar-fill.water{background:linear-gradient(90deg,#0284c7,var(--water))}
.bar-fill.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 1.8s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- Badges / pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-hi);border:1px solid var(--border);color:var(--text-1)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;width:34px;height:34px;border-radius:10px;font-style:italic;box-shadow:0 0 0 2px var(--bg-0) inset}
.chip{padding:9px 14px;border-radius:12px;background:var(--surface-hi);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text-1);transition:all var(--dur-fast)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chipset{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.input,.select,textarea.input{width:100%;background:var(--surface-hi);border:1.5px solid var(--border);color:var(--text-0);padding:12px 14px;border-radius:12px;font-size:15px;transition:border-color var(--dur-fast)}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface-hi);border:1.5px solid var(--border);border-radius:14px;padding:6px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--surface);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stepper input{flex:1;text-align:center;background:none;border:none;font-size:18px;font-weight:800}

/* ---------- Modal / sheet ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,4,12,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
:root[data-theme="light"] .overlay{background:rgba(20,15,40,.35)}
.sheet{width:100%;max-width:520px;background:var(--bg-1);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-bottom));max-height:88vh;overflow-y:auto;animation:sheetUp var(--dur-med) var(--ease-out);border:1px solid var(--border);border-bottom:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .handle{width:40px;height:5px;border-radius:99px;background:var(--border-hi);margin:6px auto 16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h3{font-size:19px;font-weight:800}
.overlay.center{align-items:center;padding:20px}
.overlay.center .sheet{border-radius:28px;max-height:85vh}

/* ---------- Toast ---------- */
#toastHost{position:fixed;top:calc(var(--safe-top) + 10px);left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--surface-hi);border:1px solid var(--border-hi);color:var(--text-0);padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;animation:toastIn var(--dur-med) var(--ease-spring)}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.bad{border-color:var(--danger);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}

/* ---------- Misc effects ---------- */
.confetti-canvas{position:fixed;inset:0;z-index:100;pointer-events:none}
.levelup-overlay{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--accent) 35%, transparent), rgba(5,4,12,.92))}
.levelup-overlay.show{display:flex}
.levelup-card{text-align:center;animation:levelPop .6s var(--ease-spring)}
@keyframes levelPop{0%{opacity:0;transform:scale(.5) translateY(30px)}100%{opacity:1;transform:none}}
.levelup-rank{font-size:110px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(180deg,#fff,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px var(--accent-glow))}
.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.skeleton{background:linear-gradient(90deg,var(--surface-hi),var(--border),var(--surface-hi));background-size:200% 100%;animation:skel 1.4s infinite;border-radius:10px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-state .icon{width:48px;height:48px;margin-bottom:12px;opacity:.5}
.hidden{display:none !important}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-8{gap:8px}.gap-12{gap:12px}
.text-2{color:var(--text-2)}.text-sm{font-size:13px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}
</style>
</head>

<div id="app"></div>

<script>
"use strict";
/* ====================================================================
   ARISE KAGE — Application Core
   Storage: localStorage (state) + IndexedDB (photos) + optional Firebase sync
   ==================================================================== */

const AK = {}; // namespace

/* ---------------- Utilities ---------------- */
AK.uid = () => 'x' + Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,6);
AK.clamp = (n,min,max) => Math.max(min, Math.min(max, n));
AK.fmtDate = (d=new Date()) => { const dt = (d instanceof Date)?d:new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); };
AK.today = () => AK.fmtDate(new Date());
AK.prettyDate = (iso) => { const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); };
AK.daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
AK.round1 = (n) => Math.round(n*10)/10;
AK.escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

AK.toast = (msg, type='') => {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const iconId = type==='good' ? 'i-check' : type==='bad' ? 'i-x' : 'i-info';
  el.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><use href="#${iconId}"/></svg><span></span>`;
  el.querySelector('span').textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(-10px)'; setTimeout(()=>el.remove(),300); }, 2600);
};

AK.haptic = (ms=8) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ---------------- Storage layer ---------------- */
const DB_KEY = 'arisekage_v1';
AK.defaultState = () => ({
  profile: null, // {name, unit:'metric'|'imperial', theme:'shadow', goal, createdAt, title}
  gamification: { xp:0, level:1, rank:'E', streak:0, lastActiveDate:null, unlockedAchievements:[], seenEasterEggs:[] },
  workouts: [], // {id,date,name,startedAt,durationSec,exercises:[{id,name,category,sets:[{weight,reps,rpe,unit,done}]}],notes}
  templates: [], // custom routine templates
  water: {}, // {date: {goalMl, entries:[{id,ts,ml}]}}
  waterGoalMl: 2600,
  nutrition: {}, // {date: {entries:[{id,ts,name,cal,protein,carbs,fat}]}}
  nutritionGoals: { cal:2200, protein:150, carbs:220, fat:70 },
  metrics: [], // {id,date,weightKg,bodyFatPct,measurements:{chest,waist,hips,arm,thigh}}
  sleep: {}, // {date: hours}
  photoMeta: [], // {id,date,tag,note} (blobs live in IndexedDB)
  settings: {
    theme: 'shadow', accent: '#7c3aed', unit: 'metric', reducedMotion:false,
    notifWater:true, notifWorkout:true, firebaseEnabled:false, firebaseConfig:null,
    quoteAnime: 'both'
  },
  quests: { date:null, daily:[] },
  version: 1
});

AK.state = null;

AK.load = () => {
  try {
    const raw = localStorage.getItem(DB_KEY);
    AK.state = raw ? Object.assign(AK.defaultState(), JSON.parse(raw)) : AK.defaultState();
    // deep-merge nested defaults for safety across versions
    const def = AK.defaultState();
    for (const k of ['gamification','settings','nutritionGoals']) {
      AK.state[k] = Object.assign({}, def[k], AK.state[k]||{});
    }
  } catch(e) { console.error('load failed', e); AK.state = AK.defaultState(); }
  return AK.state;
};

AK.saveTimer = null;
AK.save = () => {
  clearTimeout(AK.saveTimer);
  AK.saveTimer = setTimeout(()=>{
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(AK.state));
      AK.Sync && AK.Sync.queuePush && AK.Sync.queuePush();
    } catch(e) { console.error('save failed', e); AK.toast('Storage full — export a backup in Settings','bad'); }
  }, 120);
};

/* ---------------- IndexedDB (photos) ---------------- */
AK.PhotoDB = (() => {
  let dbp = null;
  const open = () => {
    if (dbp) return dbp;
    dbp = new Promise((resolve,reject)=>{
      const req = indexedDB.open('arisekage_photos', 1);
      req.onupgradeneeded = () => { const db = req.result; if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos',{keyPath:'id'}); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  };
  return {
    async put(rec){ const db = await open(); return new Promise((res,rej)=>{ const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').put(rec); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); },
    async get(id){ const db = await open(); return new Promise((res,rej)=>{ const tx = db.transaction('photos','readonly'); const r = tx.objectStore('photos').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
    async del(id){ const db = await open(); return new Promise((res,rej)=>{ const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); },
    async all(){ const db = await open(); return new Promise((res,rej)=>{ const tx = db.transaction('photos','readonly'); const r = tx.objectStore('photos').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
  };
})();
</script>

<script>
/* ---------------- Gamification: XP, Levels, Ranks ---------------- */
AK.Game = (() => {
  const RANKS = [
    {key:'E', label:'E-Rank', min:1, max:4, color:'var(--rank-e)'},
    {key:'D', label:'D-Rank', min:5, max:9, color:'var(--rank-d)'},
    {key:'C', label:'C-Rank', min:10, max:16, color:'var(--rank-c)'},
    {key:'B', label:'B-Rank', min:17, max:24, color:'var(--rank-b)'},
    {key:'A', label:'A-Rank', min:25, max:34, color:'var(--rank-a)'},
    {key:'S', label:'S-Rank', min:35, max:49, color:'var(--rank-s)'},
    {key:'SS', label:'Shadow Monarch', min:50, max:9999, color:'var(--rank-ss)'}
  ];
  const xpForLevel = (lvl) => Math.round(100 * Math.pow(lvl, 1.45));
  const rankFor = (lvl) => RANKS.find(r => lvl>=r.min && lvl<=r.max) || RANKS[RANKS.length-1];
  function addXp(amount, reason){
    const g = AK.state.gamification;
    const beforeLevel = g.level;
    g.xp += amount;
    let leveled = false;
    while (g.xp >= xpForLevel(g.level)) {
      g.xp -= xpForLevel(g.level);
      g.level += 1; leveled = true;
    }
    g.rank = rankFor(g.level).key;
    AK.save();
    if (amount>0) AK.toast(`+${amount} XP${reason?' · '+reason:''}`, 'good');
    if (leveled) AK.Game.showLevelUp(g.level, beforeLevel);
    AK.UI && AK.UI.refreshHome && AK.UI.refreshHome();
    return leveled;
  }
  function showLevelUp(newLevel, prevLevel){
    const rank = rankFor(newLevel);
    const overlay = document.getElementById('levelupOverlay');
    overlay.innerHTML = `<div class="levelup-card">
      <div style="font-size:13px;letter-spacing:.2em;color:var(--text-2);font-weight:800;margin-bottom:6px">LEVEL UP</div>
      <div class="levelup-rank">${newLevel}</div>
      <div class="pill" style="margin:14px auto 18px;background:${rank.color}22;border-color:${rank.color};color:${rank.color}">${AK.escapeHtml(rank.label)}</div>
      <div style="color:var(--text-1);font-size:14px;max-width:280px;margin:0 auto 22px">${AK.escapeHtml(AK.Quotes.random())}</div>
      <button class="btn btn-primary" id="levelupClose">Continue</button>
    </div>`;
    overlay.classList.add('show');
    AK.Fx.confettiBurst();
    AK.haptic(20);
    document.getElementById('levelupClose').onclick = () => overlay.classList.remove('show');
  }
  function updateStreak(){
    const g = AK.state.gamification;
    const today = AK.today();
    if (g.lastActiveDate === today) return;
    if (g.lastActiveDate) {
      const gap = AK.daysBetween(g.lastActiveDate, today);
      g.streak = gap === 1 ? g.streak + 1 : 1;
    } else { g.streak = 1; }
    g.lastActiveDate = today;
    AK.save();
    if ([7,30,50,100,365].includes(g.streak)) AK.Achievements.unlock('streak'+g.streak);
  }
  function derivedStats(){
    // Fun "hunter stat" numbers derived from real logged data — not arbitrary.
    const workouts = AK.state.workouts;
    let maxVolumeSet = 0, totalSets=0, totalVolume=0;
    workouts.forEach(w => w.exercises.forEach(e => e.sets.forEach(s => {
      if (s.done) { totalSets++; const vol=(s.weight||0)*(s.reps||0); totalVolume+=vol; if ((s.weight||0)>maxVolumeSet) maxVolumeSet=s.weight; }
    })));
    const STR = AK.clamp(Math.round(maxVolumeSet/2), 1, 999);
    const END = AK.clamp(Math.round(totalSets/3), 1, 999);
    const VIT = AK.clamp(Math.round(AK.state.gamification.streak*2.2), 1, 999);
    const AGI = AK.clamp(Math.round(workouts.length*1.3), 1, 999);
    return {STR,END,VIT,AGI,totalVolume:Math.round(totalVolume)};
  }
  return { RANKS, xpForLevel, rankFor, addXp, showLevelUp, updateStreak, derivedStats };
})();

    {id:'water7', name:'Hydro Hunter', desc:'Hit water goal 7 days', icon:'i-droplet'},

  ];
  function unlock(id){

    AK.Fx.confettiBurst();
    AK.Game.addXp(25, 'Achievement');
  }
  return { DEFS, unlock };
})();
</script>

<script>
/* ---------------- FX: confetti & small visual flourishes ---------------- */
AK.Fx = (() => {
  function confettiBurst(){
    if (AK.state.settings.reducedMotion) return;
    const canvas = document.getElementById('confettiCanvas');
    canvas.classList.remove('hidden');
    canvas.width = innerWidth; canvas.height = innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#7c3aed','#a78bfa','#38bdf8','#22d3aa','#fb923c','#f43f5e','#ffd54a'];
    const N = 90;
    const parts = Array.from({length:N}, () => ({
      x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*0.35 + (Math.random()-.5)*60,
      vx:(Math.random()-.5)*13, vy:(Math.random()*-13)-4, g:.35+Math.random()*.15,
      size:4+Math.random()*5, rot:Math.random()*360, vr:(Math.random()-.5)*14,
      color: colors[Math.floor(Math.random()*colors.length)], life:1
    }));
    let frame=0;
    function tick(){
      frame++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      parts.forEach(p=>{
        p.vy += p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life -= 0.008;
        if (p.life>0 && p.y < canvas.height+20) { alive=true;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
          ctx.globalAlpha = Math.max(p.life,0); ctx.fillStyle=p.color;
          ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); ctx.restore();
        }
      });
      if (alive && frame<260) requestAnimationFrame(tick); else { canvas.classList.add('hidden'); ctx.clearRect(0,0,canvas.width,canvas.height); }
    }
    tick();
  }
  function ringSvg(pct, size=120, stroke=10, colorVar='--accent'){
    const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-AK.clamp(pct,0,1));
    return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}">
        <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
        <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="var(${colorVar})" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      </svg></div>`;
  }
  return { confettiBurst, ringSvg };
})();

  {name:'Yoga Flow', cat:'Mobility'}, {name:'Stretch Routine', cat:'Mobility'}
];
AK.TEMPLATES_BUILTIN = [
  {name:'Push / Pull / Legs', tags:['PPL'], days:[
    {label:'Push', exercises:['Barbell Bench Press','Overhead Press','Incline Dumbbell Press','Lateral Raise','Tricep Pushdown']},
    {label:'Pull', exercises:['Deadlift','Barbell Row','Pull-Up','Face Pull','Barbell Curl']},
    {label:'Legs', exercises:['Barbell Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Calf Raise']}
  ]},
  {name:'Upper / Lower Split', tags:['UL'], days:[
    {label:'Upper', exercises:['Barbell Bench Press','Barbell Row','Overhead Press','Lat Pulldown','Barbell Curl','Tricep Pushdown']},
    {label:'Lower', exercises:['Barbell Back Squat','Romanian Deadlift','Leg Press','Calf Raise','Hanging Leg Raise']}
  ]},
  {name:'GZCLP (Beginner Strength)', tags:['GZCLP'], days:[
    {label:'Day 1 — Squat/Bench', exercises:['Barbell Back Squat','Barbell Bench Press','Lat Pulldown','Plank']},
    {label:'Day 2 — OHP/Deadlift', exercises:['Overhead Press','Deadlift','Barbell Row','Hanging Leg Raise']},
    {label:'Day 3 — Bench/Squat', exercises:['Barbell Bench Press','Barbell Back Squat','Lat Pulldown','Cable Crunch']},
    {label:'Day 4 — Deadlift/OHP', exercises:['Deadlift','Overhead Press','Barbell Row','Plank']}
  ]},
  {name:'Full Body (3x/week)', tags:['FullBody'], days:[
    {label:'Full Body A', exercises:['Barbell Back Squat','Barbell Bench Press','Barbell Row','Plank']},
    {label:'Full Body B', exercises:['Deadlift','Overhead Press','Pull-Up','Hanging Leg Raise']},
    {label:'Full Body C', exercises:['Front Squat','Incline Dumbbell Press','Seated Cable Row','Cable Crunch']}
  ]}
];

/* ---------------- Daily Quests ---------------- */
AK.Quests = (() => {
  const POOL = [
    {id:'log_water3', label:'Log water 3 times today', xp:15, check: s => (waterEntriesToday()>=3)},
    {id:'hit_water_goal', label:'Reach your water goal', xp:20, check: s => waterTotalToday() >= AK.state.waterGoalMl},
    {id:'log_workout', label:'Log a training session', xp:30, check: s => workoutLoggedToday()},
    {id:'log_sleep', label:'Log last night\'s sleep', xp:10, check: s => !!AK.state.sleep[AK.today()]},
    {id:'complete_5sets', label:'Complete 5 working sets', xp:20, check: s => setsDoneToday()>=5},
    {id:'open_app', label:'Check in on your progress', xp:5, check: () => true},
  ];
  function waterEntriesToday(){ const w = AK.state.water[AK.today()]; return w? w.entries.length : 0; }
  function waterTotalToday(){ const w = AK.state.water[AK.today()]; return w? w.entries.reduce((a,e)=>a+e.ml,0) : 0; }
  function workoutLoggedToday(){ return AK.state.workouts.some(w=>w.date===AK.today()); }
  function setsDoneToday(){ let n=0; AK.state.workouts.filter(w=>w.date===AK.today()).forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{if(s.done)n++;}))); return n; }
  function ensureToday(){
    const q = AK.state.quests;
    if (q.date === AK.today() && q.daily.length) return;
    const shuffled = [...POOL].sort(()=>Math.random()-.5).slice(0,4);
    q.date = AK.today();
    q.daily = shuffled.map(p => ({id:p.id, label:p.label, xp:p.xp, done:false}));
    AK.save();
  }
  function evaluate(){
    ensureToday();
    const q = AK.state.quests;
    let changed=false;
    q.daily.forEach(item => {
      if (item.done) return;
      const def = POOL.find(p=>p.id===item.id);
      if (def && def.check()) { item.done = true; changed=true; AK.Game.addXp(item.xp,'Quest'); }
    });
    if (changed) AK.save();
    return q.daily;
  }
  return { ensureToday, evaluate, get:()=>AK.state.quests.daily };
})();
</script>

<script>
/* ---------------- Sheet (bottom modal) helper ---------------- */
AK.Sheet = (() => {
  const overlay = () => document.getElementById('sheetOverlay');
  const body = () => document.getElementById('sheetBody');
  function open(html){
    body().innerHTML = `<div class="handle"></div>` + html;
    overlay().classList.add('show');
  }
  function close(){ overlay().classList.remove('show'); }
  return { open, close, body };
})();

/* ---------------- Router ---------------- */
AK.Router = (() => {
  const screens = ['home','workout','water','body','quests','settings'];
  function go(name){
    if (!screens.includes(name)) return;
    screens.forEach(s => document.getElementById('screen-'+s).classList.toggle('active', s===name));
    document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.screen===name));
    window.scrollTo(0,0);
    AK.UI.render(name);
    location.hash = name;
  }
  function init(){
    document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => { AK.haptic(); go(b.dataset.screen); }));
    const startScreen = (location.hash||'').replace('#','') || 'home';
    go(screens.includes(startScreen)?startScreen:'home');
  }
  return { go, init };
})();
</script>

<script>

AK.Workout = (() => {
  let activeSession = null; // {id,date,name,startedAt,exercises:[...],notes}
  let restTimer = { seconds:0, running:false, iv:null };

  function render(){
    const el = document.getElementById('screen-workout');
    if (activeSession) return renderActive(el);
    renderHub(el);
  }

  function renderHub(el){
    const history = [...AK.state.workouts].sort((a,b)=>b.date.localeCompare(a.date));
    el.innerHTML = `
      <h1 class="page-title">Train</h1>
      <p class="page-sub">Fast logging. Zero friction. Every set counts.</p>
      <button class="btn btn-primary btn-block" id="startBlankBtn">

        ${AK.TEMPLATES_BUILTIN.map((t,ti)=>templateCard(t,'b:'+ti)).join('')}

      <div class="section-title">History</div>
      ${history.length===0 ? emptyState('i-dumbbell','No workouts logged yet — start one above.') :
        history.slice(0,20).map(w=>historyCard(w)).join('')}
    `;
    el.querySelector('#startBlankBtn').addEventListener('click', () => startSession('Freestyle Workout', []));
    el.querySelector('#newTemplateLink').addEventListener('click', openTemplateBuilder);
    el.querySelectorAll('[data-start-tpl]').forEach(b=>b.addEventListener('click',()=>{
      const [kind,idx] = b.dataset.startTpl.split(':');
      const tpl = kind==='b' ? AK.TEMPLATES_BUILTIN[idx] : AK.state.templates[idx];
      openDayPicker(tpl);
    }));
    el.querySelectorAll('[data-view-w]').forEach(b=>b.addEventListener('click',()=>viewWorkout(b.dataset.viewW)));
  }

  function templateCard(t, key){
    return `<div class="card tap" data-start-tpl="${key}">
      <div class="flex items-center justify-between">
        <b>${AK.escapeHtml(t.name)}</b>
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
      </div>
      <div class="text-2 text-sm mt-8">${t.days.map(d=>d.label).join(' · ')}</div>
    </div>`;
  }
  function historyCard(w){
    const totalSets = w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const vol = Math.round(w.exercises.reduce((a,e)=>a+e.sets.reduce((a2,s)=>a2+(s.done?(s.weight||0)*(s.reps||0):0),0),0));
    return `<div class="card tap" data-view-w="${w.id}">
      <div class="flex items-center justify-between"><b>${AK.escapeHtml(w.name)}</b><span class="text-2 text-sm">${AK.prettyDate(w.date)}</span></div>
      <div class="text-2 text-sm mt-8">${w.exercises.length} exercises · ${totalSets} sets · ${vol}kg volume</div>
    </div>`;
  }
  function emptyState(icon,msg){
    return `<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><use href="#${icon}"/></svg><div>${msg}</div></div>`;
  }

  function openDayPicker(tpl){
    AK.Sheet.open(`<div class="sheet-head"><h3>${AK.escapeHtml(tpl.name)}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>

      const day = tpl.days[b.dataset.day];
      AK.Sheet.close();
      startSession(tpl.name+' — '+day.label, day.exercises);
    }));
  }

  function startSession(name, exerciseNames){
    activeSession = {
      id: AK.uid(), date: AK.today(), name, startedAt: Date.now(),
      exercises: exerciseNames.map(n => ({id:AK.uid(), name:n, category: (AK.EXLIB.find(x=>x.name===n)||{}).cat || 'Custom', sets:[ blankSet(n) ]})),
      notes:''
    };
    AK.Router.go('workout');
  }
  function lastUsed(name){
    for (let i=AK.state.workouts.length-1;i>=0;i--){
      const w = AK.state.workouts[i];
      const ex = w.exercises.find(e=>e.name===name);
      if (ex) { const s = [...ex.sets].reverse().find(s=>s.done); if (s) return s; }
    }
    return null;
  }
  function blankSet(name){
    const lu = lastUsed(name);
    return { weight: lu?lu.weight:0, reps: lu?lu.reps:8, rpe:null, done:false };
  }

  function renderActive(el){
    const s = activeSession;
    el.innerHTML = `
      <div class="flex items-center justify-between mt-8">
        <button class="btn-icon" id="cancelSession"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
        <div style="text-align:center"><div style="font-weight:800">${AK.escapeHtml(s.name)}</div><div class="text-2 text-sm" id="sessionTimer">00:00</div></div>
        <button class="btn-icon" id="finishSession" style="background:var(--good);color:#04231a"><svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg></button>
      </div>
      <div id="restBanner"></div>
      <div id="exerciseList" class="mt-16" style="display:flex;flex-direction:column;gap:14px">
        ${s.exercises.map((e,ei)=>exerciseBlock(e,ei)).join('')}
      </div>
      <button class="btn btn-ghost btn-block mt-16" id="addExerciseBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Add Exercise</button>
    `;
    bindActive(el);
    tickTimer();
    renderRestBanner();
  }
  function exerciseBlock(e, ei){
    return `<div class="card" data-ex="${ei}">
      <div class="flex items-center justify-between">
        <b>${AK.escapeHtml(e.name)}</b>
        <button class="btn-icon" style="width:34px;height:34px" data-swap="${ei}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-swap"/></svg></button>
      </div>
      <div style="display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:8px;align-items:center;margin-top:12px" class="text-2 text-sm">
        <div>#</div><div>kg</div><div>reps</div><div>RPE</div><div></div>
      </div>
      <div class="set-rows" data-rows="${ei}">
      ${e.sets.map((set,si)=>setRow(e,ei,set,si)).join('')}
      </div>
      <button class="btn btn-ghost btn-sm mt-8" data-add-set="${ei}">+ Add Set</button>
    </div>`;
  }
  function setRow(e,ei,set,si){
    return `<div style="display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px" data-row="${si}">
      <div class="text-sm" style="font-weight:700">${si+1}</div>
      <input class="input" style="padding:8px" inputmode="decimal" data-field="weight" data-ex="${ei}" data-set="${si}" value="${set.weight||''}">
      <input class="input" style="padding:8px" inputmode="numeric" data-field="reps" data-ex="${ei}" data-set="${si}" value="${set.reps||''}">
      <input class="input" style="padding:8px" inputmode="numeric" placeholder="-" data-field="rpe" data-ex="${ei}" data-set="${si}" value="${set.rpe||''}">
      <button class="btn-icon" style="width:34px;height:34px;background:${set.done?'var(--good)':'var(--surface-hi)'};color:${set.done?'#04231a':'var(--text-2)'}" data-done="${ei}:${si}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-check"/></svg></button>
    </div>`;
  }
  function bindActive(el){
    el.querySelector('#cancelSession').addEventListener('click', () => {
      if (confirm('Discard this workout session?')) { activeSession=null; AK.Router.go('workout'); }
    });
    el.querySelector('#finishSession').addEventListener('click', finishSession);
    el.querySelector('#addExerciseBtn').addEventListener('click', () => openExercisePicker());
    el.querySelectorAll('[data-add-set]').forEach(b=>b.addEventListener('click',()=>{
      const ei=b.dataset.addSet; const ex=activeSession.exercises[ei];
      ex.sets.push(blankSet(ex.name)); render();
    }));
    el.querySelectorAll('[data-swap]').forEach(b=>b.addEventListener('click',()=>openExercisePicker(parseInt(b.dataset.swap))));
    el.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change',()=>{
      const {ex,set,field} = inp.dataset;
      const s = activeSession.exercises[ex].sets[set];
      s[field] = field==='rpe' ? (inp.value?parseFloat(inp.value):null) : parseFloat(inp.value)||0;
    }));
    el.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{
      const [ei,si] = b.dataset.done.split(':');
      const s = activeSession.exercises[ei].sets[si];
      s.done = !s.done;
      AK.haptic(12);
      if (s.done) { checkPR(activeSession.exercises[ei], s); startRest(90); }
      render();
    }));
  }
  function checkPR(exercise, set){
    let best = 0;
    AK.state.workouts.forEach(w => w.exercises.forEach(e => { if (e.name===exercise.name) e.sets.forEach(s=>{ if(s.done && s.weight>best) best=s.weight; }); }));
    if (set.weight > best) { AK.Achievements.unlock('pr_first'); AK.toast(`New PR on ${exercise.name}! 🎉`,'good'); }
  }
  function startRest(sec){
    restTimer.seconds = sec; restTimer.running = true;
    clearInterval(restTimer.iv);
    restTimer.iv = setInterval(()=>{
      restTimer.seconds--;
      if (restTimer.seconds<=0){ clearInterval(restTimer.iv); restTimer.running=false; AK.haptic(30); AK.toast('Rest complete — back to work!'); }
      renderRestBanner();
    },1000);
    renderRestBanner();
  }
  function renderRestBanner(){
    const b = document.getElementById('restBanner');
    if (!b) return;
    if (!restTimer.running) { b.innerHTML=''; return; }
    const m = Math.floor(restTimer.seconds/60), s2 = restTimer.seconds%60;
    b.innerHTML = `<div class="card mt-16" style="display:flex;align-items:center;justify-content:space-between;border-color:var(--accent)">
      <span class="flex items-center gap-8"><svg class="icon" viewBox="0 0 24 24" style="color:var(--accent-2)"><use href="#i-clock"/></svg> Rest</span>
      <b style="font-size:20px;font-variant-numeric:tabular-nums">${m}:${String(s2).padStart(2,'0')}</b>
      <button class="btn btn-ghost btn-sm" id="skipRest">Skip</button></div>`;
    document.getElementById('skipRest').onclick = () => { clearInterval(restTimer.iv); restTimer.running=false; renderRestBanner(); };
  }
  function tickTimer(){
    const t = document.getElementById('sessionTimer');
    if (!t || !activeSession) return;
    const secs = Math.floor((Date.now()-activeSession.startedAt)/1000);
    t.textContent = String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
    if (document.getElementById('screen-workout').classList.contains('active') && activeSession) requestAnimationFrame(()=>setTimeout(tickTimer,1000));
  }
  function openExercisePicker(swapIndex){
    const cats = [...new Set(AK.EXLIB.map(e=>e.cat))];
    AK.Sheet.open(`<div class="sheet-head"><h3>${swapIndex!=null?'Swap exercise':'Add exercise'}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <input class="input" id="exSearch" placeholder="Search exercises...">
      <div class="chipset mt-16" id="exCats">${cats.map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join('')}</div>
      <div id="exResults" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:40vh;overflow-y:auto"></div>
      <button class="btn btn-ghost btn-block mt-16" id="customExBtn">+ Add custom exercise</button>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    let activeCat = null;
    function draw(){
      const q = document.getElementById('exSearch').value.toLowerCase();
      const list = AK.EXLIB.filter(e => (!activeCat||e.cat===activeCat) && e.name.toLowerCase().includes(q));
      document.getElementById('exResults').innerHTML = list.map(e=>`<button class="card tap" style="padding:12px 16px;text-align:left" data-pick="${AK.escapeHtml(e.name)}"><b>${AK.escapeHtml(e.name)}</b> <span class="text-2 text-sm">· ${e.cat}</span></button>`).join('') || emptyState('i-list','No matches — try custom exercise.');
      document.getElementById('exResults').querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
    }
    function pick(name){
      const cat = (AK.EXLIB.find(x=>x.name===name)||{}).cat || 'Custom';
      if (swapIndex!=null) { activeSession.exercises[swapIndex] = {id:AK.uid(),name,category:cat,sets:[blankSet(name)]}; }
      else activeSession.exercises.push({id:AK.uid(),name,category:cat,sets:[blankSet(name)]});
      AK.Sheet.close(); render();
    }
    document.getElementById('exSearch').addEventListener('input', draw);
    document.getElementById('exCats').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
      activeCat = activeCat===b.dataset.cat?null:b.dataset.cat;
      document.querySelectorAll('#exCats .chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===activeCat));
      draw();
    }));
    document.getElementById('customExBtn').addEventListener('click', () => {
      const name = prompt('Exercise name:'); if (name) pick(name.trim());
    });
    draw();
  }
  function finishSession(){
    const totalSets = activeSession.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    if (totalSets===0){ if(!confirm('No sets marked complete. Save anyway?')) return; }
    activeSession.durationSec = Math.floor((Date.now()-activeSession.startedAt)/1000);
    activeSession.exercises = activeSession.exercises.filter(e=>e.sets.some(s=>s.done)||e.sets.length);
    AK.state.workouts.push(activeSession);
    const wasFirst = AK.state.workouts.length===1;
    AK.save();
    AK.Game.updateStreak();
    AK.Game.addXp(30 + totalSets*4, 'Workout logged');
    if (wasFirst) AK.Achievements.unlock('first_workout');
    if (AK.state.workouts.length===10) AK.Achievements.unlock('workouts_10');
    if (AK.state.workouts.length===100) AK.Achievements.unlock('workouts_100');
    if (new Date().getHours() >= 0 && new Date().getHours() < 4) AK.Achievements.unlock('night_owl');
    activeSession = null;
    AK.Router.go('home');
    AK.toast('Workout saved 💪','good');
  }
  function viewWorkout(id){
    const w = AK.state.workouts.find(x=>x.id===id); if (!w) return;
    AK.Sheet.open(`<div class="sheet-head"><h3>${AK.escapeHtml(w.name)}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="text-2 text-sm mb-8">${AK.prettyDate(w.date)}</div>
      ${w.exercises.map(e=>`<div class="card" style="margin-bottom:10px"><b>${AK.escapeHtml(e.name)}</b>
        <div class="text-2 text-sm mt-8">${e.sets.filter(s=>s.done).map(s=>`${s.weight}kg × ${s.reps}`).join(' · ')||'No completed sets'}</div></div>`).join('')}
      <button class="btn btn-danger btn-block mt-16" id="delWorkout">Delete Workout</button>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('delWorkout').onclick = () => {
      if (confirm('Delete this workout permanently?')) { AK.state.workouts = AK.state.workouts.filter(x=>x.id!==id); AK.save(); AK.Sheet.close(); render(); }
    };
  }
  function openTemplateBuilder(){
    AK.toast('Tip: start any built-in routine, then save your own variations from history soon.','info');
  }

  return { render };
})();
</script>

<script>
/* ====================================================================
   WATER MODULE
   ==================================================================== */
AK.Water = (() => {
  const PRESETS = [
    {label:'Glass', ml:250, icon:'🥛'}, {label:'Bottle', ml:500, icon:'🍶'},
    {label:'Large Bottle', ml:1000, icon:'🧴'}, {label:'Cup', ml:200, icon:'☕'}
  ];
  function todayRec(){
    const d = AK.today();
    if (!AK.state.water[d]) AK.state.water[d] = {entries:[]};
    return AK.state.water[d];
  }
  function totalFor(dateKey){ return (AK.state.water[dateKey]?.entries||[]).reduce((a,e)=>a+e.ml,0); }

  function render(){
    const el = document.getElementById('screen-water');
    const rec = todayRec();
    const total = totalFor(AK.today());
    const goal = AK.state.waterGoalMl;
    const pct = total/goal;
    const last7 = last7Days();
    el.innerHTML = `
      <h1 class="page-title">Water</h1>
      <p class="page-sub">Hydration you'll actually keep up with.</p>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;padding:28px 16px">
        ${AK.Fx.ringSvg(pct, 160, 14, '--water')}
        <div style="margin-top:-100px;text-align:center;pointer-events:none">
          <div style="font-size:30px;font-weight:900">${total}<span style="font-size:14px;color:var(--text-2)">ml</span></div>
          <div class="text-2 text-sm">of ${goal}ml goal</div>
        </div>
        <div class="chipset mt-16" style="justify-content:center">
          ${PRESETS.map(p=>`<button class="chip" data-add="${p.ml}">${p.icon} +${p.ml}ml</button>`).join('')}
          <button class="chip" id="customAdd">✏️ Custom</button>
        </div>
      </div>

      <div class="section-title">Last 7 days</div>
      <div class="card">
        <div style="display:flex;align-items:flex-end;gap:8px;height:90px">
          ${last7.map(d=>{
            const h = AK.clamp(d.total/goal,0,1.2)*80;
            const hit = d.total>=goal;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
              <div style="width:100%;max-width:22px;height:${Math.max(h,3)}px;background:${hit?'var(--good)':'var(--water)'};border-radius:6px 6px 2px 2px"></div>
              <div class="text-2" style="font-size:9px;margin-top:6px">${d.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section-title">Today's log</div>
      ${rec.entries.length===0 ? `<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><use href="#i-droplet"/></svg><div>Nothing logged yet today</div></div>` :
        rec.entries.slice().reverse().map(e=>`<div class="card flex items-center justify-between" style="padding:12px 16px">
          <span class="flex items-center gap-8"><svg class="icon" viewBox="0 0 24 24" style="color:var(--water)"><use href="#i-droplet"/></svg>${e.ml}ml <span class="text-2 text-sm">· ${new Date(e.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></span>
          <button class="btn-icon" style="width:32px;height:32px" data-del="${e.id}"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-trash"/></svg></button>
        </div>`).join('')}

      <div class="section-title">Goal</div>
      <div class="card flex items-center justify-between">
        <span>Daily target</span>
        <div class="stepper" style="width:160px">
          <button data-goal="-100">−</button><input id="goalInput" value="${goal}"><button data-goal="100">+</button>
        </div>
      </div>
    `;
    el.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addWater(parseInt(b.dataset.add))));
    el.querySelector('#customAdd').addEventListener('click', () => {
      const v = prompt('Amount in ml:'); if (v && !isNaN(v)) addWater(parseInt(v));
    });
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      rec.entries = rec.entries.filter(e=>e.id!==b.dataset.del); AK.save(); render();
    }));
    const gi = el.querySelector('#goalInput');
    el.querySelectorAll('[data-goal]').forEach(b=>b.addEventListener('click',()=>{
      AK.state.waterGoalMl = AK.clamp(AK.state.waterGoalMl + parseInt(b.dataset.goal), 250, 10000);
      AK.save(); render();
    }));
  }
  function addWater(ml){
    const rec = todayRec();
    rec.entries.push({id:AK.uid(), ts:Date.now(), ml});
    AK.save(); AK.haptic(10);
    AK.Game.updateStreak();
    AK.Game.addXp(2,'Hydration');
    const total = totalFor(AK.today());
    if (total>=AK.state.waterGoalMl && total-ml<AK.state.waterGoalMl) { AK.toast('Water goal hit! 💧','good'); AK.Fx.confettiBurst(); checkWaterStreak(); }
    render();
    AK.UI.refreshHome();
  }
  function checkWaterStreak(){
    const days = last7Days();
    if (days.filter(d=>d.total>=AK.state.waterGoalMl).length>=7) AK.Achievements.unlock('water7');
  }
  function last7Days(){
    const out=[];
    for (let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = AK.fmtDate(d);
      out.push({label:d.toLocaleDateString(undefined,{weekday:'narrow'}), total: totalFor(key)});
    }
    return out;
  }
  function quickAddSheet(){
    AK.Sheet.open(`<div class="sheet-head"><h3>Add Water</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="chipset">${PRESETS.map(p=>`<button class="chip" data-add="${p.ml}">${p.icon} +${p.ml}ml</button>`).join('')}</div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    AK.Sheet.body().querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{ addWater(parseInt(b.dataset.add)); AK.Sheet.close(); }));
  }
  return { render, quickAddSheet, totalFor, todayRec };
})();
</script>

<script>
/* ====================================================================
   BODY MODULE — metrics + progress photos (photos stored in IndexedDB only)
   ==================================================================== */
AK.Body = (() => {
  let tab = 'photos';
  function render(){
    const el = document.getElementById('screen-body');
    el.innerHTML = `
      <h1 class="page-title">Body</h1>
      <p class="page-sub">Progress photos live only on this device. Never uploaded.</p>
      <div class="chipset">
        <button class="chip ${tab==='photos'?'active':''}" data-tab="photos">📸 Photos</button>
        <button class="chip ${tab==='metrics'?'active':''}" data-tab="metrics">📏 Metrics</button>
        <button class="chip ${tab==='sleep'?'active':''}" data-tab="sleep">🌙 Sleep</button>
      </div>
      <div id="bodyTabBody" class="mt-16"></div>
    `;
    el.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; render(); }));
    const body = document.getElementById('bodyTabBody');
    if (tab==='photos') renderPhotos(body);
    else if (tab==='metrics') renderMetrics(body);
    else renderSleep(body);
  }

  /* ---------- Photos ---------- */
  async function renderPhotos(body){
    body.innerHTML = `<button class="btn btn-primary btn-block" id="addPhotoBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-camera"/></svg> Add Progress Photo</button>
      <div id="photoGrid" class="grid-3 mt-16"></div>`;
    document.getElementById('addPhotoBtn').addEventListener('click', addPhotoFlow);
    const grid = document.getElementById('photoGrid');
    const metas = [...AK.state.photoMeta].sort((a,b)=>b.date.localeCompare(a.date));
    if (!metas.length) { grid.className=''; grid.innerHTML = emptyState(); return; }
    grid.innerHTML = metas.map(m=>`<div class="card tap" style="padding:0;overflow:hidden;aspect-ratio:3/4;position:relative" data-view-photo="${m.id}">
      <img data-src="${m.id}" style="width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-hi)">
      <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:6px 8px;font-size:10px;color:#fff;font-weight:700">${AK.prettyDate(m.date)}</div>
    </div>`).join('');
    for (const m of metas) {
      AK.PhotoDB.get(m.id).then(rec => {
        if (!rec) return;
        const url = URL.createObjectURL(rec.blob);
        const img = grid.querySelector(`img[data-src="${m.id}"]`);
        if (img) img.src = url;
      });
    }
    grid.querySelectorAll('[data-view-photo]').forEach(c=>c.addEventListener('click',()=>viewPhoto(c.dataset.viewPhoto)));
    if (metas.length>=2) {
      body.insertAdjacentHTML('beforeend', `<button class="btn btn-ghost btn-block mt-16" id="compareBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-swap"/></svg> Compare Before / After</button>`);
      document.getElementById('compareBtn').addEventListener('click', () => openCompare(metas));
    }
  }
  function emptyState(){ return `<div class="empty-state" style="grid-column:1/-1"><svg class="icon" viewBox="0 0 24 24"><use href="#i-camera"/></svg><div>No photos yet. Your future self will thank you.</div></div>`; }

  function addPhotoFlow(){
    AK.Sheet.open(`<div class="sheet-head"><h3>Add Progress Photo</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="field"><label>Angle</label><div class="chipset" id="tagChips">
        <button class="chip active" data-tag="Front">Front</button><button class="chip" data-tag="Side">Side</button><button class="chip" data-tag="Back">Back</button><button class="chip" data-tag="Other">Other</button>
      </div></div>
      <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
      <button class="btn btn-primary btn-block" id="takePhotoBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-camera"/></svg> Take / Choose Photo</button>
      <div class="field mt-16"><label>Note (optional)</label><input class="input" id="photoNote" placeholder="e.g. Week 4, morning, fasted"></div>
      <div id="photoPreviewWrap"></div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    let tagVal = 'Front', fileBlob = null;
    document.getElementById('tagChips').querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{
      tagVal=b.dataset.tag; document.querySelectorAll('#tagChips .chip').forEach(c=>c.classList.toggle('active',c===b));
    }));
    document.getElementById('takePhotoBtn').addEventListener('click', () => document.getElementById('photoInput').click());
    document.getElementById('photoInput').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      fileBlob = f;
      const url = URL.createObjectURL(f);
      document.getElementById('photoPreviewWrap').innerHTML = `<img src="${url}" style="width:100%;border-radius:16px;margin-top:14px;max-height:280px;object-fit:cover">
        <button class="btn btn-primary btn-block mt-16" id="savePhotoBtn">Save Photo</button>`;
      document.getElementById('savePhotoBtn').addEventListener('click', async () => {
        const id = AK.uid();
        await AK.PhotoDB.put({ id, blob: fileBlob });
        const wasFirst = AK.state.photoMeta.length===0;
        AK.state.photoMeta.push({ id, date: AK.today(), tag: tagVal, note: document.getElementById('photoNote').value.trim() });
        AK.save();
        AK.Game.updateStreak();
        AK.Game.addXp(15, 'Progress photo');
        if (wasFirst) AK.Achievements.unlock('photo_first');
        if (AK.state.photoMeta.length===30) AK.Achievements.unlock('photo_30');
        AK.Sheet.close(); AK.toast('Photo saved to this device','good'); render();
      });
    });
  }
  async function viewPhoto(id){
    const meta = AK.state.photoMeta.find(m=>m.id===id);
    const rec = await AK.PhotoDB.get(id);
    if (!rec) return;
    const url = URL.createObjectURL(rec.blob);
    AK.Sheet.open(`<div class="sheet-head"><h3>${meta.tag} · ${AK.prettyDate(meta.date)}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <img src="${url}" style="width:100%;border-radius:16px;max-height:50vh;object-fit:cover">
      ${meta.note?`<p class="text-2 mt-16">${AK.escapeHtml(meta.note)}</p>`:''}
      <button class="btn btn-danger btn-block mt-16" id="delPhoto">Delete Photo</button>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('delPhoto').onclick = async () => {
      if (!confirm('Delete this photo permanently from your device?')) return;
      await AK.PhotoDB.del(id);
      AK.state.photoMeta = AK.state.photoMeta.filter(m=>m.id!==id);
      AK.save(); AK.Sheet.close(); render();
    };
  }
  async function openCompare(metas){
    const first = metas[metas.length-1], last = metas[0];
    const [r1,r2] = await Promise.all([AK.PhotoDB.get(first.id), AK.PhotoDB.get(last.id)]);
    if (!r1||!r2) return;
    const u1 = URL.createObjectURL(r1.blob), u2 = URL.createObjectURL(r2.blob);
    AK.Sheet.open(`<div class="sheet-head"><h3>Before / After</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div style="position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4">
        <img src="${u2}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <div id="beforeClip" style="position:absolute;inset:0;width:50%;overflow:hidden"><img src="${u1}" style="width:200%;height:100%;object-fit:cover;max-width:none"></div>
        <div id="sliderHandle" style="position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5)"></div>
      </div>
      <input type="range" min="0" max="100" value="50" id="compareRange" class="mt-16" style="width:100%">
      <div class="flex justify-between text-2 text-sm mt-8"><span>${AK.prettyDate(first.date)}</span><span>${AK.prettyDate(last.date)}</span></div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('compareRange').addEventListener('input', (e) => {
      document.getElementById('beforeClip').style.width = e.target.value+'%';
      document.getElementById('sliderHandle').style.left = e.target.value+'%';
    });
  }

  /* ---------- Metrics ---------- */
  function renderMetrics(body){
    const list = [...AK.state.metrics].sort((a,b)=>b.date.localeCompare(a.date));
    const unit = AK.state.settings.unit==='imperial' ? 'lb' : 'kg';
    body.innerHTML = `<button class="btn btn-primary btn-block" id="addMetricBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-scale"/></svg> Log Body Metrics</button>
      ${list.length>1 ? `<div class="card mt-16">${sparkline(list)}</div>` : ''}
      <div class="mt-16" style="display:flex;flex-direction:column;gap:10px">
      ${list.length===0 ? `<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><use href="#i-ruler"/></svg><div>No metrics logged yet</div></div>` :
        list.map(m=>`<div class="card flex items-center justify-between"><span>${AK.prettyDate(m.date)}</span><b>${m.weightKg?AK.round1(convertWeight(m.weightKg,unit))+' '+unit:'—'}</b></div>`).join('')}
      </div>`;
    document.getElementById('addMetricBtn').addEventListener('click', () => {
      AK.Sheet.open(`<div class="sheet-head"><h3>Log Metrics</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div class="field"><label>Weight (${unit})</label><input class="input" id="mWeight" inputmode="decimal"></div>
        <div class="field"><label>Body Fat % (optional)</label><input class="input" id="mBF" inputmode="decimal"></div>
        <div class="grid-2">
          <div class="field"><label>Waist (cm)</label><input class="input" id="mWaist" inputmode="decimal"></div>
          <div class="field"><label>Chest (cm)</label><input class="input" id="mChest" inputmode="decimal"></div>
          <div class="field"><label>Arms (cm)</label><input class="input" id="mArm" inputmode="decimal"></div>
          <div class="field"><label>Thigh (cm)</label><input class="input" id="mThigh" inputmode="decimal"></div>
        </div>
        <button class="btn btn-primary btn-block" id="saveMetric">Save</button>`);
      document.getElementById('shClose').onclick = AK.Sheet.close;
      document.getElementById('saveMetric').onclick = () => {
        const wRaw = parseFloat(document.getElementById('mWeight').value);
        const weightKg = wRaw ? (unit==='lb' ? wRaw/2.2046 : wRaw) : null;
        AK.state.metrics.push({ id:AK.uid(), date:AK.today(), weightKg,
          bodyFatPct: parseFloat(document.getElementById('mBF').value)||null,
          measurements:{ waist:parseFloat(document.getElementById('mWaist').value)||null, chest:parseFloat(document.getElementById('mChest').value)||null, arm:parseFloat(document.getElementById('mArm').value)||null, thigh:parseFloat(document.getElementById('mThigh').value)||null }
        });
        AK.save(); AK.Game.updateStreak(); AK.Game.addXp(10,'Metrics logged'); AK.Sheet.close(); render();
      };
    });
  }
  function convertWeight(kg, unit){ return unit==='lb' ? kg*2.2046 : kg; }
  function sparkline(list){
    const pts = [...list].reverse().filter(m=>m.weightKg).slice(-14);
    if (pts.length<2) return '<div class="text-2 text-sm">Log more entries to see a trend line</div>';
    const vals = pts.map(p=>p.weightKg);
    const min = Math.min(...vals), max = Math.max(...vals) || min+1;
    const w=280,h=60;
    const path = pts.map((p,i)=>{
      const x = (i/(pts.length-1))*w;
      const y = h - ((p.weightKg-min)/((max-min)||1))*h;
      return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px"><path d="${path}" fill="none" stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  /* ---------- Sleep ---------- */
  function renderSleep(body){
    const today = AK.state.sleep[AK.today()];
    body.innerHTML = `<div class="card">
      <div class="text-2 text-sm">Last night's sleep</div>
      <div class="stepper mt-8" style="max-width:200px"><button data-s="-0.5">−</button><input id="sleepInput" value="${today||''}" placeholder="7.5"><button data-s="0.5">+</button></div>
      <button class="btn btn-primary btn-block mt-16" id="saveSleep">Save</button>
    </div>`;
    const inp = document.getElementById('sleepInput');
    document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      inp.value = AK.round1(AK.clamp((parseFloat(inp.value)||7)+parseFloat(b.dataset.s),0,16));
    }));
    document.getElementById('saveSleep').onclick = () => {
      AK.state.sleep[AK.today()] = parseFloat(inp.value)||0;
      AK.save(); AK.Game.addXp(10,'Sleep logged'); AK.toast('Sleep logged','good'); render();
    };
  }

  return { render, addPhotoFlow };
})();
</script>

<script>
/* ====================================================================
   QUESTS / ACHIEVEMENTS UI
   ==================================================================== */
AK.QuestsUI = (() => {
  function render(){
    const el = document.getElementById('screen-quests');
    const q = AK.Quests.get();
    const g = AK.state.gamification;
    const unlocked = AK.Achievements.DEFS.filter(a => g.unlockedAchievements.includes(a.id));
    const locked = AK.Achievements.DEFS.filter(a => !g.unlockedAchievements.includes(a.id) && !a.secret);
    const lockedSecret = AK.Achievements.DEFS.filter(a => !g.unlockedAchievements.includes(a.id) && a.secret);
    el.innerHTML = `
      <h1 class="page-title">Quests & Achievements</h1>
      <p class="page-sub">Real actions. Real rewards. No hollow points.</p>
      <div class="section-title">Today's Quests</div>
      ${q.map(item=>`<div class="card flex items-center justify-between" style="opacity:${item.done?0.6:1}">
        <span class="flex items-center gap-12">
          <span class="btn-icon" style="width:34px;height:34px;background:${item.done?'var(--good)':'var(--surface-hi)'};color:${item.done?'#04231a':'var(--text-2)'}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#${item.done?'i-check':'i-target'}"/></svg></span>
          <span style="text-decoration:${item.done?'line-through':'none'}">${AK.escapeHtml(item.label)}</span>
        </span>
        <span class="pill">+${item.xp} XP</span>
      </div>`).join('')}

      <div class="section-title">Achievements (${unlocked.length}/${AK.Achievements.DEFS.length})</div>
      <div class="grid-3">
        ${unlocked.map(a=>achCard(a,true)).join('')}
        ${locked.map(a=>achCard(a,false)).join('')}
        ${lockedSecret.map(()=>secretCard()).join('')}
      </div>
      <div class="section-title">Hunter Stats</div>
      <div class="card">
        ${statRow('Level', g.level)} ${statRow('Rank', AK.Game.rankFor(g.level).label)}
        ${statRow('Longest streak', g.streak)} ${statRow('Total XP earned', totalXpEarned())}
      </div>
    `;
    el.querySelectorAll('[data-ach]').forEach(c=>c.addEventListener('click',()=>{
      const a = AK.Achievements.DEFS.find(x=>x.id===c.dataset.ach);
      AK.toast(a.name+': '+a.desc);
    }));
  }
  function totalXpEarned(){
    const g = AK.state.gamification;
    let sum = g.xp;
    for (let l=1;l<g.level;l++) sum += AK.Game.xpForLevel(l);
    return sum;
  }
  function statRow(label,val){ return `<div class="flex items-center justify-between" style="padding:6px 0"><span class="text-2">${label}</span><b>${val}</b></div>`; }
  function achCard(a, unlocked){
    return `<div class="card tap" style="text-align:center;padding:14px 8px;${unlocked?'':'opacity:.35'}" data-ach="${a.id}">
      <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;color:${unlocked?'var(--accent-2)':'var(--text-3)'}"><use href="#${a.icon}"/></svg>
      <div class="text-sm mt-8" style="font-weight:700">${a.name}</div>
    </div>`;
  }
  function secretCard(){
    return `<div class="card" style="text-align:center;padding:14px 8px;opacity:.35">
      <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;color:var(--text-3)"><use href="#i-lock"/></svg>
      <div class="text-sm mt-8" style="font-weight:700">???</div>
    </div>`;
  }
  return { render };
})();

/* ====================================================================
   SHARE MODULE — canvas-generated shareable report card
   ==================================================================== */
AK.Share = (() => {
  function open(){
    const g = AK.state.gamification, p = AK.state.profile;
    const stats = AK.Game.derivedStats();
    const waterToday = AK.Water.totalFor(AK.today());
    const consistency = weekConsistency();
    AK.Sheet.open(`<div class="sheet-head"><h3>Share Report</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <canvas id="shareCanvas" width="640" height="800" style="width:100%;border-radius:20px;box-shadow:var(--shadow-2)"></canvas>
      <div class="grid-2 mt-16">
        <button class="btn btn-ghost btn-block" id="downloadShare"><svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg> Download</button>
        <button class="btn btn-primary btn-block" id="shareNative"><svg class="icon" viewBox="0 0 24 24"><use href="#i-share"/></svg> Share</button>
      </div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    drawCard(document.getElementById('shareCanvas'), {name:p?.name||'Hunter', level:g.level, rank:AK.Game.rankFor(g.level), streak:g.streak, stats, waterToday, waterGoal:AK.state.waterGoalMl, consistency});
    document.getElementById('downloadShare').addEventListener('click', () => {
      const c = document.getElementById('shareCanvas');
      const a = document.createElement('a'); a.download = 'arise-kage-report.png'; a.href = c.toDataURL('image/png'); a.click();
    });
    document.getElementById('shareNative').addEventListener('click', async () => {
      const c = document.getElementById('shareCanvas');
      c.toBlob(async (blob) => {
        const file = new File([blob], 'arise-kage-report.png', {type:'image/png'});
        if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
          try { await navigator.share({ files:[file], title:'My Arise Kage Report', text:'Leveling up with Arise Kage 💪' }); } catch(e){}
        } else { AK.toast('Sharing not supported here — downloaded instead'); const a=document.createElement('a'); a.download='arise-kage-report.png'; a.href=c.toDataURL('image/png'); a.click(); }
      });
    });
  }
  function weekConsistency(){
    let daysActive = 0;
    for (let i=0;i<7;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = AK.fmtDate(d);
      const worked = AK.state.workouts.some(w=>w.date===key);
      const hydrated = AK.Water.totalFor(key) >= AK.state.waterGoalMl;
      if (worked || hydrated) daysActive++;
    }
    return daysActive/7;
  }
  function drawCard(canvas, d){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#0a0a12'); grad.addColorStop(1,'#1c1030');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    // glow
    const rg = ctx.createRadialGradient(W*0.8,H*0.15,10,W*0.8,H*0.15,300);
    rg.addColorStop(0,'rgba(124,58,237,.5)'); rg.addColorStop(1,'rgba(124,58,237,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#fff'; ctx.font = '900 30px sans-serif'; ctx.fillText('ARISE KAGE', 40, 70);
    ctx.fillStyle = '#a78bfa'; ctx.font = '700 16px sans-serif'; ctx.fillText(d.name.toUpperCase()+"'S WEEKLY REPORT", 40, 98);

    // level badge
    const rankColor = resolveColor(d.rank.color);
    ctx.fillStyle='rgba(255,255,255,.06)'; roundRect(ctx,40,130,W-80,120,20); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 64px sans-serif'; ctx.fillText('LV '+d.level, 64, 210);
    ctx.fillStyle=rankColor; ctx.font='800 20px sans-serif'; ctx.fillText(d.rank.label.toUpperCase(), 66, 232);
    ctx.font='800 20px sans-serif'; ctx.fillStyle='#fbbf24'; ctx.fillText('🔥 '+d.streak+' day streak', W-260, 175);
    ctx.fillStyle='#c7c6e6'; ctx.font='600 16px sans-serif'; ctx.fillText('Rank: '+d.rank.label, W-260, 205);

    // speedometer gauge for weekly consistency
    const cx=W/2, cy=340, r=110;
    ctx.lineWidth=18; ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25); ctx.stroke();
    const pct = d.consistency;
    const grad2 = ctx.createLinearGradient(cx-r,cy,cx+r,cy);
    grad2.addColorStop(0,'#f43f5e'); grad2.addColorStop(.5,'#f59e0b'); grad2.addColorStop(1,'#22d3aa');
    ctx.strokeStyle=grad2;
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*0.75+Math.PI*1.5*pct); ctx.stroke();
    // needle
    const ang = Math.PI*0.75+Math.PI*1.5*pct;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r-24,0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,8,0,7); ctx.fill();
    ctx.textAlign='center';
    ctx.font='900 36px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(Math.round(pct*100)+'%', cx, cy+95);
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#8b89ad'; ctx.fillText('WEEKLY CONSISTENCY', cx, cy+119);
    ctx.textAlign='left';

    // stat row
    const statsY = 520;
    const items = [['STR',d.stats.STR],['END',d.stats.END],['VIT',d.stats.VIT],['AGI',d.stats.AGI]];
    const colW = (W-80)/4;
    items.forEach(([label,val],i)=>{
      const x = 40+i*colW;
      ctx.fillStyle='rgba(255,255,255,.05)'; roundRect(ctx,x,statsY,colW-10,90,16); ctx.fill();
      ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.font='800 26px sans-serif'; ctx.fillText(val, x+(colW-10)/2, statsY+42);
      ctx.fillStyle='#8b89ad'; ctx.font='700 13px sans-serif'; ctx.fillText(label, x+(colW-10)/2, statsY+68);
    });
    ctx.textAlign='left';

    // water bar
    const wy = 655;
    ctx.fillStyle='#c7c6e6'; ctx.font='700 16px sans-serif'; ctx.fillText('💧 Hydration today', 40, wy);
    ctx.fillStyle='rgba(255,255,255,.1)'; roundRect(ctx,40,wy+16,W-80,16,8); ctx.fill();
    ctx.fillStyle='#38bdf8'; roundRect(ctx,40,wy+16,(W-80)*AK.clamp(d.waterToday/d.waterGoal,0,1),16,8); ctx.fill();
    ctx.fillStyle='#8b89ad'; ctx.font='600 13px sans-serif'; ctx.fillText(d.waterToday+' / '+d.waterGoal+'ml', 40, wy+52);

    ctx.fillStyle='#5c5a80'; ctx.font='600 13px sans-serif'; ctx.fillText('Made with Arise Kage — 100% free, forever.', 40, H-30);

    function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
    function resolveColor(cssVal){
      if (!cssVal.startsWith('var(')) return cssVal;
      const name = cssVal.slice(4,-1).trim();
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || '#fb923c';
    }
  }
  return { open };
})();
</script>

  function bind(el){
