    const today = AK.state.sleep[AK.today()];
    const grantedToday = AK.state.gamification.sleepXpDate === AK.today();
    body.innerHTML = `<div class="card">
      <div class="text-2 text-sm">Last night's sleep</div>
      <div class="stepper mt-8" style="max-width:200px"><button data-s="-0.5">−</button><input id="sleepInput" value="${today||''}" placeholder="7.5"><button data-s="0.5">+</button></div>
      <div class="flex gap-8 mt-16">
        <button class="btn btn-primary btn-block" id="saveSleep">Save</button>
        ${(today!=null&&today>0) ? `<button class="btn btn-ghost" id="clearSleep" style="flex-shrink:0"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>` : ''}
      </div>
    </div>`;
    const inp = document.getElementById('sleepInput');
    document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      inp.value = AK.round1(AK.clamp((parseFloat(inp.value)||7)+parseFloat(b.dataset.s),0,16));
    }));
    document.getElementById('saveSleep').onclick = () => {
      AK.state.sleep[AK.today()] = parseFloat(inp.value)||0;
      AK.save();
      // Only award XP once per day — resaving/editing today's number shouldn't
      // farm XP by hitting Save repeatedly.
      if (!grantedToday) {
        AK.state.gamification.sleepXpDate = AK.today();
        AK.save();
        AK.Game.addXp(10,'Sleep logged');
      } else {
        AK.toast('Sleep updated','good');
      }
      render();
    };
    const clearBtn = document.getElementById('clearSleep');
    if (clearBtn) clearBtn.onclick = () => {
      delete AK.state.sleep[AK.today()];
      const wasGrantedToday = AK.state.gamification.sleepXpDate === AK.today();
      if (wasGrantedToday) AK.state.gamification.sleepXpDate = null;
      AK.save();
      if (wasGrantedToday) AK.Game.removeXp(10, 'Sleep entry cleared');
      render();
    };
  }

  function openSleepTab(){ tab = 'sleep'; render(); }
  return { render, addPhotoFlow, openMetricSheet, openSleepTab };
})();
</script>

<script>
/* ====================================================================
   QUESTS / ACHIEVEMENTS UI
   ==================================================================== */
AK.QuestsUI = (() => {
  function render(){
    const el = document.getElementById('screen-quests');
    const q = AK.Quests.get();
    const g = AK.state.gamification;
    const unlocked = AK.Achievements.DEFS.filter(a => g.unlockedAchievements.includes(a.id));
    const locked = AK.Achievements.DEFS.filter(a => !g.unlockedAchievements.includes(a.id) && !a.secret);
    const lockedSecret = AK.Achievements.DEFS.filter(a => !g.unlockedAchievements.includes(a.id) && a.secret);
    el.innerHTML = `
      <h1 class="page-title">Quests & Achievements</h1>
      <p class="page-sub">Real actions. Real rewards. No hollow points.</p>
      <div class="section-title">Today's Quests</div>
      ${q.map(item=>`<div class="card flex items-center justify-between gap-12" style="opacity:${item.done?0.6:1}">
        <span class="flex items-center gap-12" style="min-width:0;flex:1">
          <span class="btn-icon" style="width:34px;height:34px;flex-shrink:0;background:${item.done?'var(--good)':'var(--surface-hi)'};color:${item.done?'#04231a':'var(--text-2)'}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#${item.done?'i-check':'i-target'}"/></svg></span>
          <span style="text-decoration:${item.done?'line-through':'none'};min-width:0">${AK.escapeHtml(item.label)}</span>
        </span>
        <span class="pill" style="flex-shrink:0;white-space:nowrap">+${item.xp} XP</span>
      </div>`).join('')}

      <div class="section-title">Achievements (${unlocked.length}/${AK.Achievements.DEFS.length})</div>
      <div class="grid-3">
        ${unlocked.map(a=>achCard(a,true)).join('')}
        ${locked.map(a=>achCard(a,false)).join('')}
        ${lockedSecret.map(()=>secretCard()).join('')}
      </div>
      <div class="section-title">Hunter Stats</div>
      <div class="card">
        ${statRow('Level', g.level)} ${statRow('Rank', AK.Game.rankFor(g.level).label)}
        ${statRow('Longest streak', g.streak)} ${statRow('Total XP earned', totalXpEarned())}
      </div>
    `;
    el.querySelectorAll('[data-ach]').forEach(c=>c.addEventListener('click',()=>{
      const a = AK.Achievements.DEFS.find(x=>x.id===c.dataset.ach);
      AK.toast(a.name+': '+a.desc);
    }));
  }
  function totalXpEarned(){
    const g = AK.state.gamification;
    let sum = g.xp;
    for (let l=1;l<g.level;l++) sum += AK.Game.xpForLevel(l);
    return sum;
  }
  function statRow(label,val){ return `<div class="flex items-center justify-between" style="padding:6px 0"><span class="text-2">${label}</span><b>${val}</b></div>`; }
  function achCard(a, unlocked){
    return `<div class="card tap" style="text-align:center;padding:14px 8px;${unlocked?'':'opacity:.35'}" data-ach="${a.id}">
      <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;color:${unlocked?'var(--accent-2)':'var(--text-3)'}"><use href="#${a.icon}"/></svg>
      <div class="text-sm mt-8" style="font-weight:700">${a.name}</div>
    </div>`;
  }
  function secretCard(){
    return `<div class="card" style="text-align:center;padding:14px 8px;opacity:.35">
      <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;color:var(--text-3)"><use href="#i-lock"/></svg>
      <div class="text-sm mt-8" style="font-weight:700">???</div>
    </div>`;
  }
  return { render };
})();

/* ====================================================================
   SHARE MODULE — canvas-generated shareable report card
   ==================================================================== */
AK.Share = (() => {
  function open(){
    const g = AK.state.gamification, p = AK.state.profile;
    const stats = AK.Game.derivedStats();
    const waterToday = AK.Water.totalFor(AK.today());
    const consistency = weekConsistency();
    AK.Sheet.open(`<div class="sheet-head"><h3>Share Report</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <canvas id="shareCanvas" width="640" height="800" style="width:100%;border-radius:20px;box-shadow:var(--shadow-2)"></canvas>
      <div class="grid-2 mt-16">
        <button class="btn btn-ghost btn-block" id="downloadShare"><svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg> Download</button>
        <button class="btn btn-primary btn-block" id="shareNative"><svg class="icon" viewBox="0 0 24 24"><use href="#i-share"/></svg> Share</button>
      </div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    drawCard(document.getElementById('shareCanvas'), {name:p?.name||'Hunter', level:g.level, rank:AK.Game.rankFor(g.level), streak:g.streak, stats, waterToday, waterGoal:AK.state.waterGoalMl, consistency});
    document.getElementById('downloadShare').addEventListener('click', () => {
      const c = document.getElementById('shareCanvas');
      const a = document.createElement('a'); a.download = 'arise-kage-report.png'; a.href = c.toDataURL('image/png'); a.click();
    });
    document.getElementById('shareNative').addEventListener('click', async () => {
      const c = document.getElementById('shareCanvas');
      c.toBlob(async (blob) => {
        const file = new File([blob], 'arise-kage-report.png', {type:'image/png'});
        if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
          try { await navigator.share({ files:[file], title:'My Arise Kage Report', text:'Leveling up with Arise Kage' }); } catch(e){}
        } else { AK.toast('Sharing not supported here — downloaded instead'); const a=document.createElement('a'); a.download='arise-kage-report.png'; a.href=c.toDataURL('image/png'); a.click(); }
      });
    });
  }
  function weekConsistency(){
    let daysActive = 0;
    for (let i=0;i<7;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = AK.fmtDate(d);
      const worked = AK.state.workouts.some(w=>w.date===key);
      const hydrated = AK.Water.totalFor(key) >= AK.state.waterGoalMl;
      if (worked || hydrated) daysActive++;
    }
    return daysActive/7;
  }
  function drawCard(canvas, d){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#0a0a12'); grad.addColorStop(1,'#1c1030');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    // glow
    const rg = ctx.createRadialGradient(W*0.8,H*0.15,10,W*0.8,H*0.15,300);
    rg.addColorStop(0,'rgba(124,58,237,.5)'); rg.addColorStop(1,'rgba(124,58,237,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#fff'; ctx.font = '900 30px sans-serif'; ctx.fillText('ARISE KAGE', 40, 70);
    ctx.fillStyle = '#a78bfa'; ctx.font = '700 16px sans-serif'; ctx.fillText(d.name.toUpperCase()+"'S WEEKLY REPORT", 40, 98);

    // level badge
    const rankColor = resolveColor(d.rank.color);
    ctx.fillStyle='rgba(255,255,255,.06)'; roundRect(ctx,40,130,W-80,120,20); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 64px sans-serif'; ctx.fillText('LV '+d.level, 64, 210);
    ctx.fillStyle=rankColor; ctx.font='800 20px sans-serif'; ctx.fillText(d.rank.label.toUpperCase(), 66, 232);
    drawIcon('M12 2s-2 4-2 7a2 2 0 0 0 4 0c0-1 1-1 1 0 0 3 2 4 2 7a5 5 0 0 1-10 0c0-5 3-7 3-9 0-2 1-3 2-5z', W-260, 156, 20, '#fbbf24');
    ctx.font='800 20px sans-serif'; ctx.fillStyle='#fbbf24'; ctx.fillText(d.streak+' day streak', W-234, 175);
    ctx.fillStyle='#c7c6e6'; ctx.font='600 16px sans-serif'; ctx.fillText('Rank: '+d.rank.label, W-260, 205);

    // speedometer gauge for weekly consistency
    const cx=W/2, cy=340, r=110;
    ctx.lineWidth=18; ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25); ctx.stroke();
    const pct = d.consistency;
    const grad2 = ctx.createLinearGradient(cx-r,cy,cx+r,cy);
    grad2.addColorStop(0,'#f43f5e'); grad2.addColorStop(.5,'#f59e0b'); grad2.addColorStop(1,'#22d3aa');
    ctx.strokeStyle=grad2;
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*0.75+Math.PI*1.5*pct); ctx.stroke();
    // needle
    const ang = Math.PI*0.75+Math.PI*1.5*pct;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r-24,0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,8,0,7); ctx.fill();
    ctx.textAlign='center';
    ctx.font='900 36px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(Math.round(pct*100)+'%', cx, cy+95);
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#8b89ad'; ctx.fillText('WEEKLY CONSISTENCY', cx, cy+119);
    ctx.textAlign='left';

    // stat row
    const statsY = 520;
    const items = [['STR',d.stats.STR],['END',d.stats.END],['VIT',d.stats.VIT],['AGI',d.stats.AGI]];
    const colW = (W-80)/4;
    items.forEach(([label,val],i)=>{
      const x = 40+i*colW;
      ctx.fillStyle='rgba(255,255,255,.05)'; roundRect(ctx,x,statsY,colW-10,90,16); ctx.fill();
      ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.font='800 26px sans-serif'; ctx.fillText(val, x+(colW-10)/2, statsY+42);
      ctx.fillStyle='#8b89ad'; ctx.font='700 13px sans-serif'; ctx.fillText(label, x+(colW-10)/2, statsY+68);
    });
    ctx.textAlign='left';

    // water bar
    const wy = 655;
    drawIcon('M12 2s7 8.5 7 13a7 7 0 0 1-14 0c0-4.5 7-13 7-13z', 40, wy-16, 18, '#38bdf8');
    ctx.fillStyle='#c7c6e6'; ctx.font='700 16px sans-serif'; ctx.fillText('Hydration today', 64, wy);
    ctx.fillStyle='rgba(255,255,255,.1)'; roundRect(ctx,40,wy+16,W-80,16,8); ctx.fill();
    ctx.fillStyle='#38bdf8'; roundRect(ctx,40,wy+16,(W-80)*AK.clamp(d.waterToday/d.waterGoal,0,1),16,8); ctx.fill();
    ctx.fillStyle='#8b89ad'; ctx.font='600 13px sans-serif'; ctx.fillText(d.waterToday+' / '+d.waterGoal+'ml', 40, wy+52);

    ctx.fillStyle='#5c5a80'; ctx.font='600 13px sans-serif'; ctx.fillText('Made with Arise Kage — 100% free, forever.', 40, H-30);

    function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
    // draws one of our SVG icon paths (24x24 viewBox) onto canvas at (x,y) top-left, scaled to `size` — keeps
    // the share card's iconography identical to the rest of the app instead of falling back to emoji glyphs.
    function drawIcon(pathD, x, y, size, color){
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size/24, size/24);
      ctx.fillStyle = color;
      ctx.fill(new Path2D(pathD));
      ctx.restore();
    }
    function resolveColor(cssVal){
      if (!cssVal.startsWith('var(')) return cssVal;
      const name = cssVal.slice(4,-1).trim();
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || '#fb923c';
    }
  }
  return { open };
})();
</script>

<script>
/* ====================================================================
   COMPANION — on-device "Coach" that reads your own logged data and turns
   it into plain-language insights. Everything here is a deterministic
   analysis of AK.state, computed locally in the browser: no network call,
   no external AI API, no account, no cost. It reads your data back to you
   with a bit of judgment, the way a good coach glancing at your log would.
   ==================================================================== */
AK.Companion = (() => {
  const CATS = ['Push','Pull','Legs','Core','Cardio','Mobility'];

  function last14Workouts(){
    const cutoff = AK.today(); const since = new Date(); since.setDate(since.getDate()-14);
    const sinceKey = AK.fmtDate(since);
    return AK.state.workouts.filter(w => w.date >= sinceKey);
  }
  function countInRange(days){
    const since = new Date(); since.setDate(since.getDate()-days);
    const sinceKey = AK.fmtDate(since);
    return AK.state.workouts.filter(w => w.date >= sinceKey).length;
  }

  function insightConsistency(){
    const last7 = countInRange(7);
    const prev7 = AK.state.workouts.filter(w => {
      const d8 = new Date(); d8.setDate(d8.getDate()-14);
      const d1 = new Date(); d1.setDate(d1.getDate()-7);
      return w.date >= AK.fmtDate(d8) && w.date < AK.fmtDate(d1);
    }).length;
    if (last7===0 && prev7===0) return { icon:'i-target', tone:'info', text:'No sessions logged in the last two weeks. One logged workout today is enough to restart momentum — the streak counter doesn’t care how long the gap was.' };
    if (last7 > prev7) return { icon:'i-trend', tone:'good', text:`You trained ${last7}x this week vs ${prev7}x the week before — trending up. Whatever changed, it's working.` };
    if (last7 < prev7) return { icon:'i-trend', tone:'warn', text:`${last7} sessions this week vs ${prev7} last week — a step down. Not a crisis, just data. Even one more session this week reverses the trend.` };
    return { icon:'i-trend', tone:'info', text:`Holding steady at ${last7} sessions a week for two weeks straight. Steady is how ranks actually get earned.` };
  }

  function insightBalance(){
    const tally = Object.fromEntries(CATS.map(c=>[c,0]));
    last14Workouts().forEach(w => w.exercises.forEach(e => {
      const sets = e.sets.filter(s=>s.done).length;
      if (tally[e.category]!=null) tally[e.category]+=sets; else tally.Push+=0;
    }));
    const total = Object.values(tally).reduce((a,b)=>a+b,0);
    if (total < 6) return { icon:'i-balance', tone:'info', text:'Not enough logged sets in the last 2 weeks to judge balance yet — a few more sessions and this gets sharper.' };
    const trained = CATS.filter(c=>tally[c]>0);
    const untrained = ['Push','Pull','Legs'].filter(c=>tally[c]===0);
    if (untrained.length){
      return { icon:'i-balance', tone:'warn', text:`${untrained.join(' and ')} ${untrained.length>1?'haven’t':'hasn’t'} shown up in your last 14 days of training. If that's not intentional, it's the easiest imbalance to fix next session.` };
    }
    const max = Math.max(...trained.map(c=>tally[c])), min = Math.min(...trained.map(c=>tally[c]));
    if (max > min*2.5 && min>0){
      const heavy = trained.find(c=>tally[c]===max), light = trained.find(c=>tally[c]===min);
      return { icon:'i-balance', tone:'warn', text:`${heavy} sets outnumber ${light} sets by more than 2:1 over two weeks. Worth a ${light} day soon to keep things even.` };
    }
    return { icon:'i-balance', tone:'good', text:'Muscle groups are reasonably balanced over the last two weeks. Nothing is being quietly neglected.' };
  }

  function insightHydration(){
    let daysHit=0, daysLogged=0, totalMl=0;
    for (let i=0;i<7;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = AK.fmtDate(d);
      const total = AK.Water.totalFor(key);
      if (total>0) daysLogged++;
      if (total>=AK.state.waterGoalMl) daysHit++;
      totalMl += total;
    }
    const avg = Math.round(totalMl/7);
    if (daysLogged===0) return { icon:'i-droplet', tone:'info', text:'No water logged this week yet. Even rough tracking tends to raise average intake — try logging for 3 days and see.' };
    if (daysHit>=6) return { icon:'i-droplet', tone:'good', text:`Hydration goal hit ${daysHit}/7 days this week, averaging ${avg}ml/day. This is a genuinely strong habit — it usually shows up in energy during training too.` };
    if (daysHit<=2) return { icon:'i-droplet', tone:'warn', text:`Only ${daysHit}/7 days hit your water goal this week (avg ${avg}ml). If ${AK.state.waterGoalMl}ml feels like a stretch, a lower, hit-able goal beats a big one you keep missing.` };
    return { icon:'i-droplet', tone:'info', text:`${daysHit}/7 days hit your water goal this week, averaging ${avg}ml/day. Room to tighten this up.` };
  }

  function insightSleep(){
    const entries = Object.entries(AK.state.sleep).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
    if (entries.length < 3) return { icon:'i-moon', tone:'info', text:'Log sleep for a few more nights and I can start connecting it to how your training goes.' };
    const avg = AK.round1(entries.reduce((a,[,h])=>a+h,0)/entries.length);
    if (avg < 6.2) return { icon:'i-moon', tone:'warn', text:`Averaging ${avg}h of sleep this week. Recovery and progressive overload both get harder under ~6h consistently — this is usually the highest-leverage fix available.` };
    if (avg >= 7.5) return { icon:'i-moon', tone:'good', text:`Averaging ${avg}h of sleep this week — solidly in the range where recovery actually keeps up with training.` };
    return { icon:'i-moon', tone:'info', text:`Averaging ${avg}h of sleep this week. Fine, not optimal — an extra 30-45 minutes tends to be the highest-return change from here.` };
  }

  function insightOverload(){
    const byExercise = {};
    AK.state.workouts.forEach(w => w.exercises.forEach(e => {
      const done = e.sets.filter(s=>s.done && s.weight>0);
      if (!done.length) return;
      const top = Math.max(...done.map(s=>s.weight));
      (byExercise[e.name] ||= []).push({ date:w.date, top });
    }));
    const candidates = Object.entries(byExercise).filter(([,arr])=>arr.length>=3).sort((a,b)=>b[1].length-a[1].length);
    if (!candidates.length) return { icon:'i-trend', tone:'info', text:'Log the same lift across 3+ sessions and I’ll track whether your top weight is actually climbing.' };
    const [name, arr] = candidates[0];
    const sorted = arr.sort((a,b)=>a.date.localeCompare(b.date));
    const first = sorted[0].top, last = sorted[sorted.length-1].top;
    if (last > first) return { icon:'i-trend', tone:'good', text:`${name} is up from ${AK.round1(first)}kg to ${AK.round1(last)}kg across your logged sessions — real progressive overload, not just showing up.` };
    if (last < first) return { icon:'i-trend', tone:'warn', text:`${name}'s top weight has dipped from ${AK.round1(first)}kg to ${AK.round1(last)}kg. Could be a deload, could be fatigue — worth checking sleep and volume.` };
    return { icon:'i-trend', tone:'info', text:`${name} has held steady at ${AK.round1(last)}kg across your last sessions. Fine for a maintenance phase — if the goal is growth, it's due for a push.` };
  }

  function insightDayPattern(){
    const counts = [0,0,0,0,0,0,0];
    AK.state.workouts.forEach(w => { counts[new Date(w.date+'T00:00:00').getDay()]++; });
    const total = counts.reduce((a,b)=>a+b,0);
    if (total < 5) return null;
    const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const min = Math.min(...counts);
    const minDays = names.filter((n,i)=>counts[i]===min);
    if (min===0 && minDays.length<=2) return { icon:'i-calendar', tone:'info', text:`${minDays.join(' and ')} ${minDays.length>1?'are':'is'} historically your quietest training day${minDays.length>1?'s':''}. Not a problem unless it's meant to be a training day and keeps slipping.` };
    return null;
  }

  function insightRank(){
    const g = AK.state.gamification; const rank = AK.Game.rankFor(g.level); const need = AK.Game.xpForLevel(g.level);
    const pct = Math.round(g.xp/need*100);
    return { icon:'i-shield', tone:'info', text:`${pct}% of the way to Level ${g.level+1}${AK.Game.rankFor(g.level+1).key!==rank.key?` — and a rank-up to ${AK.Game.rankFor(g.level+1).label} not far behind`:''}.` };
  }

  function buildInsights(){
    const list = [insightConsistency(), insightBalance(), insightHydration(), insightSleep(), insightOverload(), insightDayPattern(), insightRank()].filter(Boolean);
    return list;
  }

  /* ---------------- Ask Kage: a keyword-routed Q&A layer on top of the
     same deterministic insight functions above. Still zero network calls —
     this is pattern matching against your own logged data, not a model. ---------------- */
  function streakAnswer(){
    const g = AK.state.gamification;
    if (g.streak<=0) return { icon:'i-flame', tone:'info', text:'No active streak right now. Log anything today — a set, water, a photo — and it starts at 1.' };
    if (g.streak>=30) return { icon:'i-flame', tone:'good', text:`${g.streak} days active. That's no longer motivation — that's identity. Very few people keep a streak this long.` };
    if (g.streak>=7) return { icon:'i-flame', tone:'good', text:`${g.streak}-day streak. You're past the point where skipping one day feels normal — that's the habit doing its job.` };
    return { icon:'i-flame', tone:'info', text:`${g.streak}-day streak. The first week is the hardest one to hold — you're in it right now.` };
  }
  function restAdvice(){
    const since3 = new Date(); since3.setDate(since3.getDate()-2);
    const recentDays = new Set(AK.state.workouts.filter(w=>w.date>=AK.fmtDate(since3)).map(w=>w.date)).size;
    const sleepEntries = Object.entries(AK.state.sleep).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,3);
    const avgSleep = sleepEntries.length ? sleepEntries.reduce((a,[,h])=>a+h,0)/sleepEntries.length : null;
    if (recentDays>=3) return { icon:'i-moon', tone:'warn', text:'You\'ve trained 3 days straight. Recovery is where the actual adaptation happens — a rest or light mobility day today is the disciplined move, not the lazy one.' };
    if (avgSleep!=null && avgSleep<6 && recentDays>=1) return { icon:'i-moon', tone:'warn', text:`Recent sleep is averaging under 6h. Your body can't fully use a hard session on that little recovery — consider a lighter load today.` };
    if (recentDays===0) return { icon:'i-target', tone:'info', text:'Nothing logged the last couple of days — today is a perfectly good day to train if you\'re feeling up for it.' };
    return { icon:'i-shield', tone:'good', text:'Nothing in your recent data points to needing rest today — training as planned looks reasonable.' };
  }
  const QUESTIONS = [
    { label:'Am I consistent?', run: insightConsistency },
    { label:'Am I balanced?', run: insightBalance },
    { label:'How\'s my hydration?', run: insightHydration },
    { label:'How\'s my sleep?', run: insightSleep },
    { label:'Am I getting stronger?', run: insightOverload },
    { label:'What\'s my streak?', run: streakAnswer },
    { label:'Should I rest today?', run: restAdvice },
    { label:'My rank progress?', run: insightRank },
  ];
  function answerFor(raw){
    const t = raw.toLowerCase();
    const rules = [
      [/consisten|often|frequency|how many times|missed|showing up/, insightConsistency],
      [/balance|neglect|\bpush\b|\bpull\b|\bleg/, insightBalance],
      [/water|hydrat|drink/, insightHydration],
      [/sleep|rest.*night|tired/, insightSleep],
      [/strong|progress|overload|1rm|pr\b|lift|heavier/, insightOverload],
      [/rank|level|xp/, insightRank],
      [/day.*quiet|pattern|which day|monday|tuesday|wednesday|thursday|friday|saturday|sunday/, () => insightDayPattern() || { icon:'i-calendar', tone:'info', text:'Not enough day-of-week data yet — a few more logged sessions and I can spot patterns there.' }],
      [/streak/, streakAnswer],
      [/rest today|should i (rest|train)|recover|deload|day off/, restAdvice],
    ];
    for (const [re, fn] of rules) if (re.test(t)) return fn();
    return null;
  }
  const askHistory = [];
  function ask(question){
    if (!question || !question.trim()) return;
    const result = answerFor(question) || { icon:'i-companion', tone:'info', text:"I can only answer from what's actually logged in this app — try asking about consistency, balance, hydration, sleep, strength progress, streak, or rest. (No account, no server — this is local pattern-matching, not a live model.)" };
    askHistory.push({ q: question.trim(), a: result });
    renderFeed();
  }
  function renderFeed(){
    const feed = document.getElementById('askFeed');
    if (!feed) return;
    feed.innerHTML = askHistory.map(h => `
      <div class="ask-q">${AK.escapeHtml(h.q)}</div>
      <div class="insight-row">
        <span class="dot-icon"><svg class="icon" viewBox="0 0 24 24"><use href="#${h.a.icon}"/></svg></span>
        <span class="text-sm" style="line-height:1.55">${AK.escapeHtml(h.a.text)}</span>
      </div>`).join('');
    feed.scrollTop = feed.scrollHeight;
  }

  function headline(){
    const g = AK.state.gamification;
    if (g.streak >= 14) return 'You’re not motivated right now — you’re disciplined. That’s the version that lasts.';
    if (g.streak >= 3) return `${g.streak}-day streak. Momentum is a real, physical thing — protect it today.`;
    if (AK.state.workouts.length === 0) return 'No data yet. Log one workout and I’ll start finding real patterns instead of guessing.';
    return 'Here’s an honest read of your last two weeks — not hype, just the log talking.';
  }

  function render(){
    const el = document.getElementById('screen-coach');
    const insights = buildInsights();
    el.innerHTML = `
      <h1 class="page-title">Coach</h1>
      <p class="page-sub">Your on-device companion. Reads only what you've logged — no account, no server, no external AI call.</p>
      <div class="card glow">
        <div class="flex items-center gap-12">
          <span class="companion-orb"><svg class="icon" viewBox="0 0 24 24"><use href="#i-companion"/></svg></span>
          <div style="min-width:0"><b style="display:block;font-family:var(--font-display)">Kage's Read</b><span class="text-2 text-sm">${AK.escapeHtml(headline())}</span></div>
        </div>
      </div>
      <div class="section-title">Ask Kage</div>
      <div class="card">
        <div class="chipset" id="askChips">${QUESTIONS.map((q,i)=>`<button class="chip" data-ask="${i}">${AK.escapeHtml(q.label)}</button>`).join('')}</div>
        <div id="askFeed" class="mt-16" style="display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto"></div>
        <div class="flex gap-8 mt-16">
          <input class="input" id="askInput" placeholder="Ask about your training, sleep, hydration…">
          <button class="btn btn-primary" id="askSendBtn" style="flex-shrink:0;padding:0 18px"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg></button>
        </div>
      </div>
      <div class="section-title">What your data is showing</div>
      <div class="card">
        ${insights.map(i => `<div class="insight-row">
          <span class="dot-icon"><svg class="icon" viewBox="0 0 24 24"><use href="#${i.icon}"/></svg></span>
          <span class="text-sm" style="line-height:1.55">${AK.escapeHtml(i.text)}</span>
        </div>`).join('')}
      </div>
      <div class="section-title">Tools</div>
      <div class="grid-2">
        <button class="card tap" id="openPlateCalc" style="text-align:left">
          <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--accent-2)"><use href="#i-barbell"/></svg>
          <div style="font-weight:700;margin-top:8px">Plate Calculator</div>
          <div class="text-2 text-sm">Figure out what to load</div>
        </button>
        <button class="card tap" id="open1RM" style="text-align:left">
          <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--accent-2)"><use href="#i-gauge"/></svg>
          <div style="font-weight:700;margin-top:8px">1RM Estimator</div>
          <div class="text-2 text-sm">From any working set</div>
        </button>
      </div>
    `;
    document.getElementById('openPlateCalc').addEventListener('click', AK.Tools.openPlateCalculator);
    document.getElementById('open1RM').addEventListener('click', AK.Tools.open1RMEstimator);
    renderFeed();
    document.getElementById('askChips').querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>{
      const q = QUESTIONS[parseInt(b.dataset.ask)];
      askHistory.push({ q:q.label, a:q.run() }); renderFeed();
    }));
    const input = document.getElementById('askInput');
    const send = () => { if (!input.value.trim()) return; ask(input.value); input.value=''; };
    document.getElementById('askSendBtn').addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key==='Enter') send(); });
  }

  return { render, buildInsights };
})();
</script>

<script>
/* ====================================================================
   TOOLS — small requested utilities: plate calculator + 1RM estimator
   ==================================================================== */
AK.Tools = (() => {
  const PLATES_KG = [25,20,15,10,5,2.5,1.25];
  const PLATES_LB = [45,35,25,10,5,2.5];

  function openPlateCalculator(){
    const unit = AK.state.settings.unit==='imperial' ? 'lb' : 'kg';
    const barDefault = unit==='lb' ? 45 : 20;
    render(unit, barDefault, unit==='lb' ? 135 : 60);
    function render(unit, bar, target){
      const plates = unit==='lb' ? PLATES_LB : PLATES_KG;
      const perSide = Math.max(0, (target-bar)/2);
      const breakdown = [];
      let remaining = perSide;
      plates.forEach(p => { const n = Math.floor(remaining/p + 1e-6); if (n>0){ breakdown.push({p,n}); remaining -= n*p; } });
      const leftover = AK.round1(remaining);
      AK.Sheet.open(`<div class="sheet-head"><h3>Plate Calculator</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div class="grid-2">
          <div class="field"><label>Bar weight (${unit})</label><input class="input" id="pcBar" inputmode="decimal" value="${bar}"></div>
          <div class="field"><label>Target weight (${unit})</label><input class="input" id="pcTarget" inputmode="decimal" value="${target}"></div>
        </div>
        <div class="card" style="margin-top:4px">
          <div class="text-2 text-sm">Per side</div>
          <div class="plate-bar">
            ${breakdown.length ? breakdown.map(b => Array.from({length:b.n}).map(()=>platePill(b.p,unit)).join('')).join('') : '<span class="text-2 text-sm">Bar only</span>'}
          </div>
          ${leftover>0.01 ? `<div class="text-2 text-sm">+ ${leftover}${unit} not achievable with standard plates</div>` : ''}
        </div>`);
      document.getElementById('shClose').onclick = AK.Sheet.close;
      const barInput = document.getElementById('pcBar'), targetInput = document.getElementById('pcTarget');
      [barInput, targetInput].forEach(inp => inp.addEventListener('input', () => {
        render(unit, parseFloat(barInput.value)||0, parseFloat(targetInput.value)||0);
      }));
    }
  }
  function platePill(weight, unit){
    const size = 26 + Math.min(weight,25)*1.1;
    const hue = weight>=20 ? 'var(--danger)' : weight>=10 ? 'var(--accent)' : weight>=5 ? 'var(--good)' : 'var(--info)';
    return `<span class="plate" style="width:${Math.round(size*0.4)}px;height:${Math.round(size)}px;background:${hue}">${weight}</span>`;
  }

  function open1RMEstimator(){
    render(100, 5);
    function render(weight, reps){
      const oneRm = reps<=1 ? weight : weight * (1 + reps/30); // Epley formula
      const rows = [1,2,3,5,8,10,12].map(r => ({ r, w: r===1?oneRm:oneRm/(1+r/30) }));
      AK.Sheet.open(`<div class="sheet-head"><h3>1RM Estimator</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div class="grid-2">
          <div class="field"><label>Weight lifted</label><input class="input" id="rmWeight" inputmode="decimal" value="${weight}"></div>
          <div class="field"><label>Reps completed</label><input class="input" id="rmReps" inputmode="numeric" value="${reps}"></div>
        </div>
        <div class="card" style="text-align:center">
          <div class="text-2 text-sm">Estimated 1-rep max</div>
          <div style="font-family:var(--font-display);font-size:34px;font-weight:700;margin-top:4px">${AK.round1(oneRm)}</div>
          <div class="text-2 text-sm">Epley formula — treat as a planning estimate, not gospel</div>
        </div>
        <div class="section-title">Rep chart</div>
        <div class="card">
          ${rows.map(row=>`<div class="flex items-center justify-between" style="padding:7px 0"><span class="text-2">${row.r} rep${row.r>1?'s':''}</span><b>${AK.round1(row.w)}</b></div>`).join('')}
        </div>`);
      document.getElementById('shClose').onclick = AK.Sheet.close;
      const w = document.getElementById('rmWeight'), r = document.getElementById('rmReps');
      [w,r].forEach(inp=>inp.addEventListener('input',()=>{
        render(parseFloat(w.value)||0, AK.clamp(parseInt(r.value)||1,1,20));
      }));
    }
  }

  return { openPlateCalculator, open1RMEstimator };
})();
</script>

      if (b.dataset.theme==='auto') { AK.state.settings.themeMode='auto'; AK.applySystemTheme(); }

        AK.state.settings.themeMode = 'manual';

        if (t) AK.state.settings.accent = t.accent;
      }
      AK.save(); AK.applyTheme(); render();
    }));
    el.querySelectorAll('[data-accent]').forEach(b=>b.addEventListener('click',()=>{
      AK.state.settings.accent = b.dataset.accent; AK.save(); AK.applyTheme(); render();
    }));
    el.querySelector('#customAccent').addEventListener('input', (e) => { AK.state.settings.accent = e.target.value; AK.save(); AK.applyTheme(); });
    el.querySelector('#toggleMotion').addEventListener('click', () => { AK.state.settings.reducedMotion = !AK.state.settings.reducedMotion; AK.save(); AK.applyTheme(); render(); });
    el.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{ AK.state.settings.unit = b.dataset.unit; AK.save(); render(); }));

    el.querySelector('#toggleNotifWorkout').addEventListener('click', () => { AK.state.settings.notifWorkout = !AK.state.settings.notifWorkout; AK.save(); render(); });

    el.querySelector('#exportBtn').addEventListener('click', exportBackup);
    el.querySelector('#importBtn').addEventListener('click', () => el.querySelector('#importFile').click());
    el.querySelector('#importFile').addEventListener('change', importBackup);
    el.querySelector('#resetBtn').addEventListener('click', resetAll);
  }
  function exportBackup(){
    const blob = new Blob([JSON.stringify(AK.state,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.download = `arise-kage-backup-${AK.today()}.json`; a.href = URL.createObjectURL(blob); a.click();
    AK.toast('Backup downloaded','good');
  }
  function importBackup(e){
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!confirm('This will replace your current data with the backup. Continue?')) return;
        AK.state = Object.assign(AK.defaultState(), data);
        AK.save(); AK.applyTheme(); AK.toast('Backup restored','good'); AK.Router.go('home');
      } catch(err) { AK.toast('Invalid backup file','bad'); }
    };
    reader.readAsText(f);
  }
  function resetAll(){
    if (!confirm('This will permanently erase ALL data on this device, including photos. This cannot be undone. Continue?')) return;
    if (!confirm('Are you absolutely sure? Consider exporting a backup first.')) return;
    localStorage.removeItem(DB_KEY);
    AK.PhotoDB.all().then(all => Promise.all(all.map(r=>AK.PhotoDB.del(r.id)))).finally(()=>location.reload());
  }
  return { render };
})();

/* ====================================================================
   FIREBASE SYNC (optional, free-tier, config supplied by user)
   ==================================================================== */
AK.Sync = (() => {
  let fbApp=null, fbAuth=null, fbDb=null, ready=false;
  async function init(){
    const s = AK.state.settings;
    if (!s.firebaseEnabled || !s.firebaseConfig) return;
    try {
      const [{ initializeApp }, { getAuth, signInAnonymously }, { getFirestore, doc, setDoc, getDoc }] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
      ]);
      fbApp = initializeApp(s.firebaseConfig);
      fbAuth = getAuth(fbApp);
      await signInAnonymously(fbAuth);
      fbDb = getFirestore(fbApp);
      AK._fbHelpers = { doc, setDoc, getDoc };
      ready = true;
      AK.toast('Cloud sync connected','good');
    } catch(e) { console.error('Firebase init failed', e); AK.toast('Cloud sync failed to connect — check your config','bad'); }
  }
  async function queuePush(){
    if (!ready || !fbAuth?.currentUser) return;
    try {
      const { doc, setDoc } = AK._fbHelpers;
      const snapshot = Object.assign({}, AK.state, { profileOnly:false });
      delete snapshot.photoMeta; // metadata only, blobs never leave device
      await setDoc(doc(fbDb, 'arisekage_users', fbAuth.currentUser.uid), { data: JSON.stringify(snapshot), updatedAt: Date.now() });
    } catch(e) { console.warn('sync push failed', e); }
  }
  function openConfigSheet(){
    const s = AK.state.settings;
    AK.Sheet.open(`<div class="sheet-head"><h3>Firebase Cloud Sync</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <p class="text-2 text-sm mb-16">Create a free Firebase project at firebase.google.com (Spark plan, no card needed), enable Anonymous Auth + Firestore, then paste your config below. Sensitive — don't share this with anyone or commit it to a public repo.</p>
      <textarea class="input" id="fbConfigInput" rows="6" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'>${s.firebaseConfig?JSON.stringify(s.firebaseConfig,null,2):''}</textarea>
      <div class="grid-2 mt-16">
        <button class="btn btn-ghost btn-block" id="fbDisconnect">Disconnect</button>
        <button class="btn btn-primary btn-block" id="fbConnect">Connect</button>
      </div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('fbDisconnect').onclick = () => { AK.state.settings.firebaseEnabled=false; AK.state.settings.firebaseConfig=null; AK.save(); AK.Sheet.close(); AK.toast('Disconnected'); };
    document.getElementById('fbConnect').onclick = () => {
      try {
        const cfg = JSON.parse(document.getElementById('fbConfigInput').value);
        AK.state.settings.firebaseConfig = cfg; AK.state.settings.firebaseEnabled = true; AK.save();
        AK.Sheet.close(); init();
      } catch(e) { AK.toast('Invalid JSON config','bad'); }
    };
  }
  return { init, queuePush, openConfigSheet };
})();
</script>

<script>
/* ====================================================================
   THEME APPLICATION
   ==================================================================== */
AK.applyTheme = () => {
  const s = AK.state.settings;
  document.documentElement.setAttribute('data-theme', s.theme);
  document.documentElement.style.setProperty('--accent', s.accent);
  // derive a lighter accent-2 automatically
  document.documentElement.style.setProperty('--accent-2', lighten(s.accent, 22));
  document.documentElement.style.setProperty('--accent-glow', s.accent + 'aa');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', s.accent);
  document.body.classList.toggle('reduced-motion', !!s.reducedMotion);
  const brandText = s.theme==='kage' ? 'KAGE HUNTER' : s.theme==='nothing' ? 'ARISE (1)' : 'ARISE KAGE';
  const label = document.getElementById('brandLabel'); if (label) label.textContent = brandText;
  const labelSide = document.getElementById('brandLabelSide'); if (labelSide) labelSide.textContent = brandText;
};
/* "Auto" theme mode: follow the OS light/dark preference. We only ever
   switch between 'shadow' (dark) and 'light' here — a user who picked the
   'kage' preset explicitly is choosing manual mode by definition. */
AK.applySystemTheme = () => {
  if (AK.state.settings.themeMode !== 'auto') return;
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  AK.state.settings.theme = prefersDark ? 'shadow' : 'light';
  AK.state.settings.accent = AK.state.settings.accent || '#7c3aed';
};
function lighten(hex, pct){
  try {
    const n = parseInt(hex.replace('#',''),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.min(255,Math.round(r+(255-r)*pct/100)); g=Math.min(255,Math.round(g+(255-g)*pct/100)); b=Math.min(255,Math.round(b+(255-b)*pct/100));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e){ return hex; }
}

/* ====================================================================
   PWA: manifest + service worker registered via Blob URLs (single-file friendly)
   ==================================================================== */
AK.setupPWA = () => {
  const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23${(AK.state.settings.accent||'#7c3aed').replace('#','')}'/><path d='M30 70 L50 25 L70 70 M38 55 L62 55' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(iconSvg.replace(/%23/g,'#'));
  const manifest = {
    name: "Arise Kage — Level Up. For Real.", short_name: "Arise Kage",
    description: "Track workouts, water, nutrition, and progress photos. Free forever.",
    start_url: ".", display: "standalone", background_color: "#0a0a12", theme_color: AK.state.settings.accent||'#7c3aed',
    icons: [{ src: iconUrl, sizes: "100x100", type: "image/svg+xml", purpose:"any maskable" }]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  let link = document.querySelector('link[rel="manifest"]');
  if (!link) { link = document.createElement('link'); link.rel='manifest'; document.head.appendChild(link); }
  link.href = URL.createObjectURL(manifestBlob);

  // NOTE: browsers refuse to register a service worker from a blob:/data: URL
  // (script must be same-origin http/https) — so full offline caching needs the
  // tiny companion sw.js file shipped next to this index.html. If that file
  // isn't present (e.g. this HTML was opened standalone), registration just
  // fails silently and the app continues to work online-only.
  if ('serviceWorker' in navigator && (location.protocol==='http:'||location.protocol==='https:')) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching unavailable, app still works fine online */ });
  }
};

/* ====================================================================
   TOUR / HELP — a short multi-step walkthrough per section, shown once
   automatically the first time you visit it, and replayable anytime via
   the "?" button in the header or Settings → Help & Tours.
   ==================================================================== */
AK.Tour = (() => {
  const TOURS = {
    home: [
      'Home is your dashboard — level, rank, XP, and your current streak all live up top.',
      'Quick Actions jump straight into logging a workout, water, or checking your Coach for the day.',
      'The insight card underneath adapts to your recent activity — it\'s not generic advice, it reads your own logs.'
    ],
    workout: [
      'Start an Empty Workout, repeat your last one, or run a built-in / custom Routine.',
      'This Week\'s Plan lets you assign a focus (or a Rest day) to each day — tap any day to set it.',
      'Inside a session, tap the "?" next to any exercise for a quick looping demo of the movement.',
      'Sets can be added or removed anytime with the + / trash icons — nothing is locked in once logged.',
      'Not a gym session? Use "Log Running / Sport / Other Activity" at the bottom — you can even type your own sport name.'
    ],
    water: [
      'Tap a preset (Glass, Bottle, Large Bottle, Mug) to log instantly, or use Custom for any amount.',
      'The ring shows today\'s progress toward your goal — adjust the goal anytime below.',
      'Every entry in today\'s log can be edited or deleted with the icons on the right.'
    ],
    body: [
      'Impact is a body map scaled to your logged height & weight — redder zones were trained more recently.',
      'Tap any muscle zone to see this week\'s set count for it, and check the Suggested workout card for what to train next based on your goal.',
      'Photos, Metrics and Sleep are the other tabs — all fully editable, and photos never leave this device.'
    ],
    quests: [
      'Daily Quests refresh every day and grant bonus XP for completing them.',
      'Achievements unlock permanently as you hit milestones — check back to see what\'s next.'
    ],
    coach: [
      'Ask Kage anything about your training in plain language, or tap one of the suggested questions.',
      'This runs entirely on your own logged data, on this device — no external AI service involved.'
    ],
    settings: [
      'Your profile, goal, theme and units all live here — everything is editable, nothing is locked.',
      'Export/Import backs up your data as a JSON file you control. Reset wipes everything if you ever want a clean start.',
      'Come back here anytime to replay any section\'s tour under Help & Tours.'
    ]
  };
  function seen(section){ return !!(AK.state.settings.toursSeen && AK.state.settings.toursSeen[section]); }
  function markSeen(section){ AK.state.settings.toursSeen = AK.state.settings.toursSeen || {}; AK.state.settings.toursSeen[section] = true; AK.save(); }
  function maybeAutoShow(section){ if (!seen(section) && TOURS[section]) show(section); }
  function show(section){
    const steps = TOURS[section] || ['No tour written for this section yet.'];
    let i = 0;
    function render(){
      document.getElementById('tourOverlay')?.remove();
      const div = document.createElement('div');
      div.id = 'tourOverlay';
      div.style.cssText = 'position:fixed;inset:0;z-index:205;background:rgba(4,4,10,.75);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)';
      div.innerHTML = `<div class="card" style="max-width:320px;width:100%;padding:22px 18px">
        <div class="text-2 text-sm">Tour · step ${i+1} of ${steps.length}</div>
        <p style="margin-top:10px;line-height:1.55">${AK.escapeHtml(steps[i])}</p>
        <div class="flex gap-8 mt-16">
          ${i>0?`<button class="btn btn-ghost" id="tourBack">Back</button>`:`<button class="btn btn-ghost" id="tourSkip">Skip</button>`}
          <button class="btn btn-primary btn-block" id="tourNext">${i===steps.length-1?'Done':'Next'}</button>
        </div>
      </div>`;
      document.body.appendChild(div);
      const close = () => { div.remove(); markSeen(section); };
      div.querySelector('#tourNext').addEventListener('click', () => { if (i<steps.length-1){ i++; render(); } else close(); });
      const skipBtn = div.querySelector('#tourSkip');
      if (skipBtn) skipBtn.addEventListener('click', close);
      const backBtn = div.querySelector('#tourBack');
      if (backBtn) backBtn.addEventListener('click', () => { i--; render(); });
    }
    render();
  }
  return { show, maybeAutoShow, seen, sections: () => Object.keys(TOURS) };
})();

/* ====================================================================
   PWA INSTALL FLOW — a custom Install/Dismiss card (instead of relying on
   the browser's own mini-infobar). Dismissing only hides it for this page
   load — nothing is persisted, so it comes back on every refresh until the
   app is actually installed. Once installed we remember that (there's no
   reliable cross-browser "is it still installed" check), and if you're
   ever back in a regular browser tab instead of the installed app, we show
   an "Open App" nudge instead of nagging you to install again.
   ==================================================================== */
AK.PWAInstall = (() => {
  let deferredPrompt = null;
  function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
  function markInstalled(){ if (!AK.state.settings.pwaInstalled) { AK.state.settings.pwaInstalled = true; AK.save(); } }
  function init(){
    if (isStandalone()) markInstalled();
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallCard();
    });
    window.addEventListener('appinstalled', () => {
      markInstalled();
      document.getElementById('pwaInstallCard')?.remove();
      AK.toast('Installed! Look for Arise Kage on your home screen.','good');
    });
    // Already known-installed but viewing in a plain browser tab right now.
    if (AK.state.settings.pwaInstalled && !isStandalone()) showOpenAppCard();
  }
  function cardShell(id, html){
    document.getElementById(id)?.remove();
    const div = document.createElement('div');
    div.id = id;
    div.style.cssText = `position:fixed;left:0;right:0;bottom:calc(var(--safe-bottom) + 84px);z-index:150;display:flex;justify-content:center;padding:0 14px;pointer-events:none`;
    div.innerHTML = `<div class="card" style="max-width:420px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.55);pointer-events:auto">${html}</div>`;
    document.body.appendChild(div);
    return div;
  }
  function showInstallCard(){
    if (isStandalone() || AK.state.settings.pwaInstalled || document.getElementById('pwaInstallCard')) return;
    const div = cardShell('pwaInstallCard', `
      <div class="flex items-center gap-12">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px;color:var(--accent-2);flex-shrink:0"><use href="#i-install"/></svg>
        <div style="flex:1"><b style="display:block">Install Arise Kage</b><span class="text-2 text-sm">Home-screen icon, works offline, opens like a real app.</span></div>
      </div>
      <div class="flex gap-8 mt-16">
        <button class="btn btn-ghost btn-block" id="pwaDismiss">Not now</button>
        <button class="btn btn-primary btn-block" id="pwaInstallBtn">Install</button>
      </div>`);
    div.querySelector('#pwaDismiss').addEventListener('click', () => div.remove());
    div.querySelector('#pwaInstallBtn').addEventListener('click', async () => {
      if (!deferredPrompt) { div.remove(); return; }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice.catch(()=>null);
      if (choice && choice.outcome==='accepted') markInstalled();
      deferredPrompt = null;
      div.remove();
    });
  }
  function showOpenAppCard(){
    if (document.getElementById('pwaOpenCard')) return;
    const div = cardShell('pwaOpenCard', `
      <div class="flex items-center gap-12">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px;color:var(--good);flex-shrink:0"><use href="#i-shield"/></svg>
        <div style="flex:1"><b style="display:block">Arise Kage is installed</b><span class="text-2 text-sm">Open the app you installed instead of this browser tab.</span></div>
        <button class="btn-icon" id="pwaOpenDismiss" style="flex-shrink:0"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-x"/></svg></button>
      </div>
      <button class="btn btn-primary btn-block mt-16" id="pwaOpenBtn">Open App</button>`);
    div.querySelector('#pwaOpenDismiss').addEventListener('click', () => div.remove());
    div.querySelector('#pwaOpenBtn').addEventListener('click', () => {
      // Browsers don't expose a guaranteed API to hand off from a regular tab
      // to an already-installed PWA — this is the standards-compliant best
      // effort (some platforms route it to the installed app automatically).
      window.open(location.href, '_blank');
      AK.toast('If nothing opened, look for Arise Kage on your home screen or app list.');
    });
  }
  return { init };
})();

/* ====================================================================
   EASTER EGGS
   ==================================================================== */
AK.setupEasterEggs = () => {
  // Konami code
  const seq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let pos = 0;
  window.addEventListener('keydown', (e) => {
    pos = (e.key === seq[pos]) ? pos+1 : (e.key===seq[0] ? 1 : 0);
    if (pos === seq.length) { pos=0; AK.Achievements.unlock('konami'); AK.toast('Secret Technique unlocked!','good'); }
  });
  // Typing "arise" anywhere unlocks an achievement (buffer of last 10 keys)
  let buf = '';
  window.addEventListener('keypress', (e) => {
    buf = (buf + e.key).slice(-10).toLowerCase();
    if (buf.includes('arise')) { AK.Achievements.unlock('arise_typed'); buf=''; }
  });
  // Tap logo 7 times fast
  let taps=[];
  document.addEventListener('click', (e) => {
    if (e.target.closest && e.target.closest('.topbar .mark')) {
      const now = Date.now(); taps.push(now); taps = taps.filter(t=>now-t<2500);
      if (taps.length>=7) { taps=[]; AK.Achievements.unlock('konami'); AK.Fx.confettiBurst(); }
    }
  });
};

/* ====================================================================
   BOOTSTRAP
   ==================================================================== */
AK.boot2 = () => {
  AK.Sync.init();
  AK.Quests.ensureToday();
  AK.UI.render(location.hash.replace('#','')||'home');
};

document.addEventListener('DOMContentLoaded', () => {
  // inject app shell
  const tpl = document.getElementById('app-shell-tpl');
  document.getElementById('app').innerHTML = tpl.innerHTML;

  AK.load();
  AK.applySystemTheme();
  AK.applyTheme();
  AK.setupPWA();
  AK.PWAInstall.init();
  AK.setupEasterEggs();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (AK.state.settings.themeMode==='auto') { AK.applySystemTheme(); AK.applyTheme(); }
    });
  }

  document.getElementById('sheetOverlay').addEventListener('click', (e) => { if (e.target.id==='sheetOverlay') AK.Sheet.close(); });

  if (AK.state.profile) {
    document.getElementById('screen-onboard').classList.remove('active');
    document.getElementById('appChrome').classList.remove('hidden');
    AK.Router.init();
    AK.boot2();
  } else {
    document.getElementById('screen-onboard').classList.add('active');
    AK.Onboard.render();
  }
});
</script>
