<script>
/* ====================================================================
   PLANNER — a simple weekly workout plan: assign a label (and optionally
   a linked routine, or mark it a rest day) to each day of the week.
   ==================================================================== */
AK.Planner = (() => {
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  function todayKey(){ const d = new Date().getDay(); return DAYS[(d+6)%7]; }
  function planFor(day){ return AK.state.planner[day] || null; }
  function summaryHtml(){
    const today = todayKey();
    return `<div class="section-title">This Week's Plan</div>
      <div class="card">
        <div class="chipset" id="plannerDays">
          ${DAYS.map(d=>{
            const p = planFor(d);
            const short = p ? (p.label.length>9?p.label.slice(0,8)+'…':p.label) : '—';
            return `<button class="chip ${d===today?'active':''}" data-plan-day="${d}" style="flex-direction:column;gap:2px;padding:8px 10px">
              <span style="font-size:11px;font-weight:800">${d}</span>
              <span style="font-size:9px;opacity:.8">${AK.escapeHtml(short)}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="mt-16" id="plannerTodayCard">${todayCardHtml()}</div>
      </div>`;
  }
  function todayCardHtml(){
    const p = planFor(todayKey());
    if (!p) return `<p class="text-2 text-sm">No plan set for today — tap a day above to set one.</p>`;
    if (p.rest) return `<p class="text-sm"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:-3px"><use href="#i-moon"/></svg> <b>Rest day.</b> Recovery is part of the program too.</p>`;
    return `<div class="flex items-center justify-between">
      <div><div class="text-2 text-sm">Today's plan</div><b>${AK.escapeHtml(p.label)}</b></div>
      ${p.tplKey ? `<button class="btn btn-primary" id="plannerStartBtn">Start</button>` : ''}
    </div>`;
  }
  function bind(el){
    el.querySelectorAll('[data-plan-day]').forEach(b=>b.addEventListener('click',()=>openDaySheet(b.dataset.planDay)));
    const startBtn = document.getElementById('plannerStartBtn');
    if (startBtn) startBtn.addEventListener('click', () => {
      const p = planFor(todayKey());
      if (!p || !p.tplKey) return;
      const [kind,idx] = p.tplKey.split(':');
      const tpl = kind==='b' ? AK.TEMPLATES_BUILTIN[idx] : AK.state.templates[idx];
      if (!tpl) { AK.toast('That routine was deleted — pick a new plan for this day','bad'); return; }
      AK.Workout.openDayPicker(tpl);
    });
  }
  function openDaySheet(day){
    const existing = planFor(day);
    const allTpls = [...AK.TEMPLATES_BUILTIN.map((t,i)=>({key:'b:'+i,name:t.name})), ...AK.state.templates.map((t,i)=>({key:'u:'+i,name:t.name}))];
    let tplKey = (existing && existing.tplKey) || '';
    AK.Sheet.open(`<div class="sheet-head"><h3>${day}'s plan</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="field"><label>Label</label><input class="input" id="pdLabel" placeholder="e.g. Push Day, Rest, Cardio" value="${existing?AK.escapeHtml(existing.label):''}"></div>
      <div class="field"><label>Link a routine (optional)</label>
        <div class="chipset" id="pdTpl">
          <button class="chip active" data-tpl="">None</button>
          ${allTpls.map(t=>`<button class="chip ${tplKey===t.key?'active':''}" data-tpl="${t.key}">${AK.escapeHtml(t.name)}</button>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block mt-16" id="pdSave">Save</button>
      <button class="btn btn-ghost btn-block mt-8" id="pdRest">Mark as Rest Day</button>
      ${existing?`<button class="btn btn-danger btn-block mt-8" id="pdClear">Clear this day</button>`:''}`, {tall:true});
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.querySelectorAll('#pdTpl .chip').forEach(c=>c.classList.toggle('active', c.dataset.tpl===tplKey));
    document.getElementById('pdTpl').querySelectorAll('[data-tpl]').forEach(b=>b.addEventListener('click',()=>{
      tplKey = b.dataset.tpl;
      document.querySelectorAll('#pdTpl .chip').forEach(c=>c.classList.toggle('active', c.dataset.tpl===tplKey));
    }));
    document.getElementById('pdSave').onclick = () => {
      const label = document.getElementById('pdLabel').value.trim();
      if (!label) { AK.toast('Give it a label first','bad'); return; }
      AK.state.planner[day] = { label, tplKey: tplKey||null, rest:false };
      AK.save(); AK.Sheet.close(); AK.Workout.render();
    };
    document.getElementById('pdRest').onclick = () => {
      AK.state.planner[day] = { label:'Rest', tplKey:null, rest:true };
      AK.save(); AK.Sheet.close(); AK.Workout.render();
    };
    const clearBtn = document.getElementById('pdClear');
    if (clearBtn) clearBtn.onclick = () => {
      delete AK.state.planner[day];
      AK.save(); AK.Sheet.close(); AK.Workout.render();
    };
  }
  return { summaryHtml, bind, todayKey, planFor, DAYS };
})();
</script>

<script>
/* ====================================================================
   DEMO — tiny looping stick-figure animation per exercise, opened from a
   "?" icon. Not video/GIF (keeps the app a single static file with zero
   hosting) — a handful of hand-built animated SVG motion patterns mapped
   from each exercise's category, which covers the "what does this movement
   look like" need without needing 40 unique recordings.
   ==================================================================== */
AK.Demo = (() => {
  const CAT_MOTION = { Legs:'squat', Push:'press', Pull:'pull', Arms:'curl', Core:'core', Cardio:'cardio', Mobility:'stretch' };
  const CUES = {
    squat:'Push your hips back and bend the knees, keeping your chest tall — then drive back up through your heels.',
    press:'Press directly away from your body, extending fully without slamming the joint locked out.',
    pull:'Drive your elbows back and squeeze your shoulder blades together before returning under control.',
    curl:'Bend only at the elbow — keep your upper arm still and control the lowering half just as much as the lift.',
    core:'Brace like you\'re about to be poked in the stomach, and hold a straight, stable line.',
    cardio:'Keep a steady, light rhythm — quick relaxed steps beat long, heavy ones.',
    stretch:'Move slowly and breathe out as you go deeper. Never force a stretch into sharp pain.',
    pulse:'Move with control through the full range of motion, pausing briefly at the hardest point.'
  };
  function motionFor(name){
    const meta = AK.EXLIB.find(x=>x.name===name);
    return (meta && CAT_MOTION[meta.cat]) || 'pulse';
  }
  function svgFor(motion){
    const open = `<svg viewBox="0 0 120 120" style="width:150px;height:150px;display:block;margin:0 auto;overflow:visible" fill="none" stroke="var(--accent-2)" stroke-width="5" stroke-linecap="round">`;
    const head = `<circle cx="60" cy="20" r="10" fill="var(--accent-2)" stroke="none"/>`;
    const wrap = (svgInner, styleInner) => `${open}${head}${svgInner}</svg><style>${styleInner}</style>`;
    if (motion==='squat') return wrap(
      `<g id="dMove"><line x1="60" y1="30" x2="60" y2="62"/><line x1="60" y1="62" x2="42" y2="100"/><line x1="60" y1="62" x2="78" y2="100"/>
       <line x1="60" y1="40" x2="40" y2="55"/><line x1="60" y1="40" x2="80" y2="55"/></g>`,
      `#dMove{transform-origin:60px 62px;animation:dKf 1.4s ease-in-out infinite}
       @keyframes dKf{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(14px) scaleY(.82)}}`);
    if (motion==='press') return wrap(
      `<line x1="60" y1="30" x2="60" y2="70"/><line x1="60" y1="70" x2="46" y2="100"/><line x1="60" y1="70" x2="74" y2="100"/>
       <line id="dMove" x1="60" y1="42" x2="30" y2="42"/><line id="dMove2" x1="60" y1="42" x2="90" y2="42"/>`,
      `#dMove,#dMove2{transform-origin:60px 42px;animation:dKf 1.4s ease-in-out infinite}
       @keyframes dKf{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}`);
    if (motion==='pull') return wrap(
      `<line x1="60" y1="30" x2="60" y2="70"/><line x1="60" y1="70" x2="46" y2="100"/><line x1="60" y1="70" x2="74" y2="100"/>
       <line id="dMove" x1="60" y1="45" x2="90" y2="45"/><line id="dMove2" x1="60" y1="45" x2="30" y2="45"/>`,
      `#dMove,#dMove2{transform-origin:60px 45px;animation:dKf 1.4s ease-in-out infinite}
       @keyframes dKf{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.5)}}`);
    if (motion==='curl') return wrap(
      `<line x1="60" y1="30" x2="60" y2="70"/><line x1="60" y1="70" x2="46" y2="100"/><line x1="60" y1="70" x2="74" y2="100"/>
       <line x1="60" y1="45" x2="86" y2="55"/><line id="dMove" x1="86" y1="55" x2="86" y2="80"/>`,
      `#dMove{transform-origin:86px 55px;animation:dKf 1.3s ease-in-out infinite}
       @keyframes dKf{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-95deg)}}`);
    if (motion==='core') return wrap(
      `<g id="dMove"><line x1="60" y1="30" x2="60" y2="70"/><line x1="60" y1="70" x2="40" y2="95"/><line x1="60" y1="70" x2="80" y2="95"/>
       <line x1="60" y1="45" x2="35" y2="60"/><line x1="60" y1="45" x2="85" y2="60"/></g>`,
      `#dMove{transform-origin:60px 60px;animation:dKf 1.6s ease-in-out infinite}
       @keyframes dKf{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}`);
    if (motion==='cardio') return wrap(
      `<line x1="60" y1="30" x2="60" y2="65"/><line id="dMove" x1="60" y1="65" x2="80" y2="95"/><line id="dMove2" x1="60" y1="65" x2="40" y2="95"/>
       <line x1="60" y1="42" x2="40" y2="52"/><line x1="60" y1="42" x2="80" y2="52"/>`,
      `#dMove{transform-origin:60px 65px;animation:dKfF .7s ease-in-out infinite}
       #dMove2{transform-origin:60px 65px;animation:dKfB .7s ease-in-out infinite}
       @keyframes dKfF{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-24deg)}}
       @keyframes dKfB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(18deg)}}`);
    return wrap(
      `<g id="dMove"><line x1="60" y1="30" x2="60" y2="70"/><line x1="60" y1="70" x2="46" y2="100"/><line x1="60" y1="70" x2="74" y2="100"/>
       <line x1="60" y1="42" x2="34" y2="30"/><line x1="60" y1="42" x2="86" y2="55"/></g>`,
      `#dMove{transform-origin:60px 70px;animation:dKf 1.8s ease-in-out infinite}
       @keyframes dKf{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}`);
  }
  // Standalone overlay (not AK.Sheet) — this can be opened from *inside* a
  // sheet (the exercise picker, an active exercise card) without wiping out
  // whatever's underneath it, since AK.Sheet only supports one panel at a time.
  function open(name){
    const motion = motionFor(name);
    document.getElementById('demoOverlay')?.remove();
    const div = document.createElement('div');
    div.id = 'demoOverlay';
    div.style.cssText = 'position:fixed;inset:0;z-index:210;background:rgba(4,4,10,.72);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)';
    div.innerHTML = `<div class="card" style="max-width:320px;width:100%;padding:22px 16px;position:relative;text-align:center">
      <button class="btn-icon" id="demoClose" style="position:absolute;top:8px;right:8px"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
      <h3 style="margin-bottom:2px">${AK.escapeHtml(name)}</h3>
      ${svgFor(motion)}
      <p class="text-2 text-sm mt-16">${CUES[motion]}</p>
      <p class="text-2 text-sm" style="opacity:.7;margin-top:4px">Loops until you close this — no video download needed.</p>
    </div>`;
    document.body.appendChild(div);
    const close = () => div.remove();
    div.addEventListener('click', (e) => { if (e.target===div) close(); });
    div.querySelector('#demoClose').addEventListener('click', close);
  }
  return { open };
})();
</script>

<script>
/* ====================================================================
   WORKOUT MODULE
   ==================================================================== */
AK.Workout = (() => {
  let activeSession = null; // {id,date,name,startedAt,exercises:[...],notes}
  let restTimer = { seconds:0, running:false, iv:null };

  function render(){
    const el = document.getElementById('screen-workout');
    document.getElementById('fabBtn').classList.toggle('hidden', !!activeSession);
    if (activeSession) return renderActive(el);
    renderHub(el);
  }

  function renderHub(el){
    const history = [...AK.state.workouts].sort((a,b)=>b.date.localeCompare(a.date));
    el.innerHTML = `
      <h1 class="page-title">Train</h1>
      <p class="page-sub">Fast logging. Zero friction. Every set counts.</p>
      <div class="grid-2">
        <button class="btn btn-primary btn-block" id="startBlankBtn" style="grid-column:${history.length?'auto':'1/-1'}">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Empty Workout
        </button>
        ${history.length ? `<button class="btn btn-ghost btn-block" id="repeatLastBtn">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-refresh"/></svg> Repeat Last
        </button>` : ''}
      </div>
      ${AK.Planner.summaryHtml()}
      <div class="section-title">Routines<span class="link" id="newTemplateLink">+ New</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${AK.TEMPLATES_BUILTIN.map((t,ti)=>templateCard(t,'b:'+ti,false)).join('')}
        ${AK.state.templates.map((t,ti)=>templateCard(t,'u:'+ti,true)).join('')}
      </div>
      <div class="section-title">History</div>
      ${history.length===0 ? emptyState('i-dumbbell','No workouts logged yet — start one above.') :
        history.slice(0,20).map(w=>historyCard(w)).join('')}
      ${AK.Activity.historyList()}
      <button class="btn btn-ghost btn-block mt-16" id="logActivityBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-run"/></svg> Log Running / Sport / Other Activity</button>
    `;
    el.querySelector('#startBlankBtn').addEventListener('click', () => startSession('Freestyle Workout', []));
    el.querySelector('#logActivityBtn').addEventListener('click', () => AK.Activity.logSheet());
    AK.Activity.bindHistory(el);
    AK.Planner.bind(el);
    const repeatBtn = el.querySelector('#repeatLastBtn');
    if (repeatBtn) repeatBtn.addEventListener('click', () => {
      const last = history[0];
      startSession(last.name, last.exercises.map(e=>e.name));
    });
    el.querySelector('#newTemplateLink').addEventListener('click', openTemplateBuilder);
    el.querySelectorAll('[data-start-tpl]').forEach(b=>b.addEventListener('click',()=>{
      const [kind,idx] = b.dataset.startTpl.split(':');
      const tpl = kind==='b' ? AK.TEMPLATES_BUILTIN[idx] : AK.state.templates[idx];
      openDayPicker(tpl);
    }));
    el.querySelectorAll('[data-del-tpl]').forEach(b=>b.addEventListener('click',(ev)=>{
      ev.stopPropagation();
      if (!confirm('Delete this custom routine?')) return;
      AK.state.templates.splice(parseInt(b.dataset.delTpl),1);
      AK.save(); renderHub(el);
    }));
    el.querySelectorAll('[data-view-w]').forEach(b=>b.addEventListener('click',()=>viewWorkout(b.dataset.viewW)));
  }

  function templateCard(t, key, isCustom){
    const idx = key.split(':')[1];
    return `<div class="card tap" data-start-tpl="${key}">
      <div class="flex items-center justify-between">
        <b>${AK.escapeHtml(t.name)}</b>
        <span class="flex items-center gap-8">
          ${isCustom ? `<button class="btn-icon" style="width:28px;height:28px" data-del-tpl="${idx}"><svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><use href="#i-trash"/></svg></button>` : ''}
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </span>
      </div>
      <div class="text-2 text-sm mt-8">${t.days.map(d=>d.label).join(' · ')}</div>
    </div>`;
  }
  function historyCard(w){
    const totalSets = w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const vol = Math.round(w.exercises.reduce((a,e)=>a+e.sets.reduce((a2,s)=>a2+(s.done?(s.weight||0)*(s.reps||0):0),0),0));
    return `<div class="card tap" data-view-w="${w.id}">
      <div class="flex items-center justify-between"><b>${AK.escapeHtml(w.name)}</b><span class="text-2 text-sm">${AK.prettyDate(w.date)}</span></div>
      <div class="text-2 text-sm mt-8">${w.exercises.length} exercises · ${totalSets} sets · ${vol}kg volume</div>
    </div>`;
  }
  function emptyState(icon,msg){
    return `<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><use href="#${icon}"/></svg><div>${msg}</div></div>`;
  }

  function openDayPicker(tpl){
    AK.Sheet.open(`<div class="sheet-head"><h3>${AK.escapeHtml(tpl.name)}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div style="display:flex;flex-direction:column;gap:10px">
      ${tpl.days.map((d,i)=>`<button class="card tap" data-day="${i}" style="text-align:left"><b>${AK.escapeHtml(d.label)}</b><div class="text-2 text-sm mt-8">${d.exercises.join(', ')}</div></button>`).join('')}
      </div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    AK.Sheet.body().querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{
      const day = tpl.days[b.dataset.day];
      AK.Sheet.close();
      startSession(tpl.name+' — '+day.label, day.exercises);
    }));
  }

  function startSession(name, exerciseNames){
    activeSession = {
      id: AK.uid(), date: AK.today(), name, startedAt: Date.now(),
      exercises: exerciseNames.map(n => {
        const meta = AK.EXLIB.find(x=>x.name===n) || {};
        const type = meta.type || 'weighted';
        return {id:AK.uid(), name:n, category: meta.cat || 'Custom', type, muscle: meta.muscle || null, sets:[ blankSet(n, type) ]};
      }),
      notes:''
    };
    AK.Router.go('workout');
  }
  function lastUsed(name){
    for (let i=AK.state.workouts.length-1;i>=0;i--){
      const w = AK.state.workouts[i];
      const ex = w.exercises.find(e=>e.name===name);
      if (ex) { const s = [...ex.sets].reverse().find(s=>s.done); if (s) return s; }
    }
    return null;
  }
  function blankSet(name, type){
    const lu = lastUsed(name);
    if (type==='timed') return { seconds: (lu&&lu.seconds)?lu.seconds:30, done:false };
    if (type==='reps') return { reps: (lu&&lu.reps)?lu.reps:10, rpe:null, done:false };
    return { weight: (lu&&lu.weight!=null)?lu.weight:0, reps: (lu&&lu.reps)?lu.reps:8, rpe:null, done:false };
  }

  function renderActive(el){
    const s = activeSession;
    el.innerHTML = `
      <div class="flex items-center justify-between mt-8">
        <button class="btn-icon" id="cancelSession"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
        <div style="text-align:center"><div style="font-weight:800">${AK.escapeHtml(s.name)}</div><div class="text-2 text-sm mono" id="sessionTimer">00:00</div></div>
        <button class="btn-icon" id="finishSession" style="background:var(--good);color:#04231a"><svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg></button>
      </div>
      <div id="restBanner"></div>
      <div id="exerciseList" class="mt-16" style="display:flex;flex-direction:column;gap:14px">
        ${s.exercises.map((e,ei)=>exerciseBlock(e,ei)).join('')}
      </div>
      <button class="btn btn-ghost btn-block mt-16" id="addExerciseBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Add Exercise</button>
    `;
    bindActive(el);
    tickTimer();
    renderRestBanner();
  }
  const SET_COLS = { weighted:'26px 1fr 1fr 1fr 34px 30px', reps:'26px 1fr 1fr 34px 30px', timed:'26px 1fr 34px 30px' };
  const SET_HEADERS = { weighted:['#','kg','reps','RPE','',''], reps:['#','reps','RPE','',''], timed:['#','sec','',''] };
  function exerciseBlock(e, ei){
    const type = e.type || 'weighted';
    return `<div class="card" data-ex="${ei}">
      <div class="flex items-center justify-between">
        <div>
          <b>${AK.escapeHtml(e.name)}</b>
          ${type==='timed' ? `<span class="text-2 text-sm"> · hold, no weight needed</span>` : ''}
        </div>
        <span class="flex items-center gap-8">
          <button class="btn-icon" style="width:34px;height:34px" data-demo="${AK.escapeHtml(e.name)}" aria-label="How to do this exercise"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-question"/></svg></button>
          <button class="btn-icon" style="width:34px;height:34px" data-swap="${ei}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-swap"/></svg></button>
        </span>
      </div>
      <div style="display:grid;grid-template-columns:${SET_COLS[type]};gap:8px;align-items:center;margin-top:12px" class="text-2 text-sm">
        ${SET_HEADERS[type].map(h=>`<div>${h}</div>`).join('')}
      </div>
      <div class="set-rows" data-rows="${ei}">
      ${e.sets.length ? e.sets.map((set,si)=>setRow(e,ei,set,si)).join('') : `<div class="text-2 text-sm" style="padding:6px 0 2px">No sets yet.</div>`}
      </div>
      <button class="btn btn-ghost btn-sm mt-8" data-add-set="${ei}">+ Add Set</button>
    </div>`;
  }
  function setRow(e,ei,set,si){
    const type = e.type || 'weighted';
    const doneBtn = `<button class="btn-icon" style="width:34px;height:34px;background:${set.done?'var(--good)':'var(--surface-hi)'};color:${set.done?'#04231a':'var(--text-2)'}" data-done="${ei}:${si}"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-check"/></svg></button>`;
    const delBtn = `<button class="btn-icon" style="width:30px;height:30px;color:var(--bad)" data-del-set="${ei}:${si}" aria-label="Remove set"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-trash"/></svg></button>`;
    const num = si+1;
    if (type==='timed'){
      return `<div style="display:grid;grid-template-columns:${SET_COLS.timed};gap:8px;align-items:center;margin-top:8px" data-row="${si}">
        <div class="text-sm" style="font-weight:700">${num}</div>
        <input class="input" style="padding:8px" inputmode="numeric" placeholder="sec" data-field="seconds" data-ex="${ei}" data-set="${si}" value="${set.seconds||''}">
        ${doneBtn}${delBtn}
      </div>`;
    }
    if (type==='reps'){
      return `<div style="display:grid;grid-template-columns:${SET_COLS.reps};gap:8px;align-items:center;margin-top:8px" data-row="${si}">
        <div class="text-sm" style="font-weight:700">${num}</div>
        <input class="input" style="padding:8px" inputmode="numeric" data-field="reps" data-ex="${ei}" data-set="${si}" value="${set.reps||''}">
        <input class="input" style="padding:8px" inputmode="numeric" placeholder="-" data-field="rpe" data-ex="${ei}" data-set="${si}" value="${set.rpe||''}">
        ${doneBtn}${delBtn}
      </div>`;
    }
    return `<div style="display:grid;grid-template-columns:${SET_COLS.weighted};gap:8px;align-items:center;margin-top:8px" data-row="${si}">
      <div class="text-sm" style="font-weight:700">${num}</div>
      <input class="input" style="padding:8px" inputmode="decimal" data-field="weight" data-ex="${ei}" data-set="${si}" value="${set.weight||''}">
      <input class="input" style="padding:8px" inputmode="numeric" data-field="reps" data-ex="${ei}" data-set="${si}" value="${set.reps||''}">
      <input class="input" style="padding:8px" inputmode="numeric" placeholder="-" data-field="rpe" data-ex="${ei}" data-set="${si}" value="${set.rpe||''}">
      ${doneBtn}${delBtn}
    </div>`;
  }
  function bindActive(el){
    el.querySelector('#cancelSession').addEventListener('click', () => {
      if (confirm('Discard this workout session?')) { activeSession=null; AK.Router.go('workout'); }
    });
    el.querySelector('#finishSession').addEventListener('click', finishSession);
    el.querySelector('#addExerciseBtn').addEventListener('click', () => openExercisePicker());
    el.querySelectorAll('[data-add-set]').forEach(b=>b.addEventListener('click',()=>{
      const ei=b.dataset.addSet; const ex=activeSession.exercises[ei];
      ex.sets.push(blankSet(ex.name, ex.type)); render();
    }));
    el.querySelectorAll('[data-del-set]').forEach(b=>b.addEventListener('click',()=>{
      const [ei,si] = b.dataset.delSet.split(':');
      activeSession.exercises[ei].sets.splice(parseInt(si),1);
      AK.haptic(8); render();
    }));
    el.querySelectorAll('[data-swap]').forEach(b=>b.addEventListener('click',()=>openExercisePicker(parseInt(b.dataset.swap))));
    el.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>AK.Demo.open(b.dataset.demo)));
    el.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change',()=>{
      const {ex,set,field} = inp.dataset;
      const s = activeSession.exercises[ex].sets[set];
      s[field] = field==='rpe' ? (inp.value?parseFloat(inp.value):null) : parseFloat(inp.value)||0;
    }));
    el.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{
      const [ei,si] = b.dataset.done.split(':');
      const s = activeSession.exercises[ei].sets[si];
      s.done = !s.done;
      AK.haptic(12);
      if (s.done) { checkPR(activeSession.exercises[ei], s); startRest(90); }
      render();
    }));
  }
  function checkPR(exercise, set){
    const type = exercise.type || 'weighted';
    let best = 0, val = 0, label = '';
    if (type==='timed'){
      AK.state.workouts.forEach(w => w.exercises.forEach(e => { if (e.name===exercise.name) e.sets.forEach(s=>{ if(s.done && s.seconds>best) best=s.seconds; }); }));
      val = set.seconds||0; label = `${val}s hold`;
    } else if (type==='reps'){
      AK.state.workouts.forEach(w => w.exercises.forEach(e => { if (e.name===exercise.name) e.sets.forEach(s=>{ if(s.done && s.reps>best) best=s.reps; }); }));
      val = set.reps||0; label = `${val} reps`;
    } else {
      AK.state.workouts.forEach(w => w.exercises.forEach(e => { if (e.name===exercise.name) e.sets.forEach(s=>{ if(s.done && s.weight>best) best=s.weight; }); }));
      val = set.weight||0; label = `${val}kg`;
    }
    if (val > best && val > 0) { AK.Achievements.unlock('pr_first'); AK.toast(`New PR on ${exercise.name} — ${label}`,'good'); }
  }
  function startRest(sec){
    restTimer.seconds = sec; restTimer.running = true;
    clearInterval(restTimer.iv);
    restTimer.iv = setInterval(()=>{
      restTimer.seconds--;
      if (restTimer.seconds<=0){ clearInterval(restTimer.iv); restTimer.running=false; AK.haptic(30); AK.Fx.beep(660,220); AK.toast('Rest complete — back to work!'); }
      renderRestBanner();
    },1000);
    renderRestBanner();
  }
  function renderRestBanner(){
    const b = document.getElementById('restBanner');
    if (!b) return;
    if (!restTimer.running) { b.innerHTML=''; return; }
    const m = Math.floor(restTimer.seconds/60), s2 = restTimer.seconds%60;
    b.innerHTML = `<div class="card mt-16" style="display:flex;align-items:center;justify-content:space-between;border-color:var(--accent)">
      <span class="flex items-center gap-8"><svg class="icon" viewBox="0 0 24 24" style="color:var(--accent-2)"><use href="#i-clock"/></svg> Rest</span>
      <b style="font-size:20px;font-variant-numeric:tabular-nums">${m}:${String(s2).padStart(2,'0')}</b>
      <button class="btn btn-ghost btn-sm" id="skipRest">Skip</button></div>`;
    document.getElementById('skipRest').onclick = () => { clearInterval(restTimer.iv); restTimer.running=false; renderRestBanner(); };
  }
  function tickTimer(){
    const t = document.getElementById('sessionTimer');
    if (!t || !activeSession) return;
    const secs = Math.floor((Date.now()-activeSession.startedAt)/1000);
    t.textContent = String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
    if (document.getElementById('screen-workout').classList.contains('active') && activeSession) requestAnimationFrame(()=>setTimeout(tickTimer,1000));
  }
  function openExercisePicker(swapIndex){
    const cats = [...new Set(AK.EXLIB.map(e=>e.cat))];
    AK.Sheet.open(`<div class="sheet-pinned">
      <div class="sheet-head"><h3>${swapIndex!=null?'Swap exercise':'Add exercise'}</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <input class="input" id="exSearch" placeholder="Search exercises...">
      <div class="chipset mt-16" id="exCats">${cats.map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join('')}</div>
      </div>
      <div id="exResults" class="sheet-scroll" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-bottom:4px"></div>
      <div class="sheet-pinned">
      <button class="btn btn-ghost btn-block mt-16" id="customExBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Add custom exercise</button>
      </div>`, {tall:true});
    document.getElementById('shClose').onclick = AK.Sheet.close;
    let activeCat = null;
    function draw(){
      const q = document.getElementById('exSearch').value.toLowerCase();
      const list = AK.EXLIB.filter(e => (!activeCat||e.cat===activeCat) && e.name.toLowerCase().includes(q));
      document.getElementById('exResults').innerHTML = list.map(e=>`<div class="card tap" style="padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <button data-pick="${AK.escapeHtml(e.name)}" style="all:unset;flex:1;cursor:pointer;text-align:left"><b>${AK.escapeHtml(e.name)}</b><br><span class="text-2 text-sm">${e.cat}</span></button>
        <span class="flex items-center gap-8" style="flex-shrink:0">
          <button class="btn-icon" style="width:30px;height:30px" data-demo="${AK.escapeHtml(e.name)}" aria-label="How to do this exercise"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-question"/></svg></button>
          <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--text-3)"><use href="#i-chevron-right"/></svg>
        </span>
      </div>`).join('') || emptyState('i-list','No matches — try custom exercise.');
      document.getElementById('exResults').querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
      document.getElementById('exResults').querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',(ev)=>{ ev.stopPropagation(); AK.Demo.open(b.dataset.demo); }));
    }
    function pick(name, opts={}){
      const meta = AK.EXLIB.find(x=>x.name===name)||{};
      const cat = opts.category || meta.cat || 'Custom';
      const type = opts.type || meta.type || 'weighted';
      const muscle = opts.muscle || meta.muscle || null;
      const exObj = {id:AK.uid(),name,category:cat,type,muscle,sets:[blankSet(name,type)]};
      if (swapIndex!=null) { activeSession.exercises[swapIndex] = exObj; }
      else activeSession.exercises.push(exObj);
      AK.Sheet.close(); render();
    }
    document.getElementById('exSearch').addEventListener('input', draw);
    document.getElementById('exCats').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
      activeCat = activeCat===b.dataset.cat?null:b.dataset.cat;
      document.querySelectorAll('#exCats .chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===activeCat));
      draw();
    }));
    document.getElementById('customExBtn').addEventListener('click', () => openCustomExerciseSheet(pick, swapIndex));
    draw();
  }
  function openCustomExerciseSheet(pick, swapIndex){
    const cats = [...new Set(AK.EXLIB.map(e=>e.cat))];
    const muscles = Object.keys(AK.MUSCLE_LABEL);
    let type = 'weighted', cat = cats[0], muscle = 'chest';
    AK.Sheet.open(`<div class="sheet-pinned">
      <div class="sheet-head"><button class="btn-icon" id="ceBack"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg></button><h3>Custom exercise</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      </div>
      <div class="sheet-scroll" style="margin-top:10px">
        <label class="text-2 text-sm">Name</label>
        <input class="input mt-8" id="ceName" placeholder="e.g. Trap Bar Deadlift">
        <label class="text-2 text-sm mt-16" style="display:block">How is it tracked?</label>
        <div class="chipset mt-8" id="ceType">
          ${Object.entries(AK.EX_TYPE_LABEL).map(([k,v])=>`<button class="chip${k==='weighted'?' active':''}" data-type="${k}">${v}</button>`).join('')}
        </div>
        <label class="text-2 text-sm mt-16" style="display:block">Category</label>
        <div class="chipset mt-8" id="ceCat">${cats.map((c,i)=>`<button class="chip${i===0?' active':''}" data-cat="${c}">${c}</button>`).join('')}</div>
        <label class="text-2 text-sm mt-16" style="display:block">Primary muscle (for body impact map)</label>
        <div class="chipset mt-8" id="ceMuscle">${muscles.map((m,i)=>`<button class="chip${m==='chest'?' active':''}" data-muscle="${m}">${AK.MUSCLE_LABEL[m]}</button>`).join('')}</div>
      </div>
      <div class="sheet-pinned">
        <button class="btn btn-primary btn-block mt-16" id="ceSave">Add exercise</button>
      </div>`, {tall:true});
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('ceBack').onclick = () => openExercisePicker(swapIndex);
    document.getElementById('ceType').querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{
      type = b.dataset.type;
      document.querySelectorAll('#ceType .chip').forEach(c=>c.classList.toggle('active',c.dataset.type===type));
    }));
    document.getElementById('ceCat').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
      cat = b.dataset.cat;
      document.querySelectorAll('#ceCat .chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===cat));
    }));
    document.getElementById('ceMuscle').querySelectorAll('[data-muscle]').forEach(b=>b.addEventListener('click',()=>{
      muscle = b.dataset.muscle;
      document.querySelectorAll('#ceMuscle .chip').forEach(c=>c.classList.toggle('active',c.dataset.muscle===muscle));
    }));
    document.getElementById('ceSave').addEventListener('click', () => {
      const name = document.getElementById('ceName').value.trim();
      if (!name) { AK.toast('Give it a name first','bad'); return; }
      pick(name, {category:cat, type, muscle});
    });
  }
  function finishSession(){
    const totalSets = activeSession.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    if (totalSets===0){ if(!confirm('No sets marked complete. Save anyway?')) return; }
    activeSession.durationSec = Math.floor((Date.now()-activeSession.startedAt)/1000);
    activeSession.exercises = activeSession.exercises.filter(e=>e.sets.some(s=>s.done)||e.sets.length);
    const xpEarned = 30 + totalSets*4;
    activeSession.xpEarned = xpEarned;
    AK.state.workouts.push(activeSession);
    const wasFirst = AK.state.workouts.length===1;
    AK.save();
    AK.Game.updateStreak();
    AK.Game.addXp(xpEarned, 'Workout logged');
    if (wasFirst) AK.Achievements.unlock('first_workout');
    if (AK.state.workouts.length===10) AK.Achievements.unlock('workouts_10');
    if (AK.state.workouts.length===100) AK.Achievements.unlock('workouts_100');
    if (new Date().getHours() >= 0 && new Date().getHours() < 4) AK.Achievements.unlock('night_owl');
    activeSession = null;
    AK.Router.go('home');
  }
  function setSummary(e, s){
    const type = e.type||'weighted';
    if (type==='timed') return `${s.seconds||0}s`;
    if (type==='reps') return `${s.reps||0} reps`;
    return `${s.weight||0}kg × ${s.reps||0}`;
  }
  function viewWorkout(id, editMode){
    const w = AK.state.workouts.find(x=>x.id===id); if (!w) return;
    if (!editMode){
      AK.Sheet.open(`<div class="sheet-head"><h3>${AK.escapeHtml(w.name)}</h3><button class="btn-icon" id="ceEdit"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-edit"/></svg></button><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div class="text-2 text-sm mb-8">${AK.prettyDate(w.date)}</div>
        ${w.exercises.map(e=>`<div class="card" style="margin-bottom:10px"><b>${AK.escapeHtml(e.name)}</b>
          <div class="text-2 text-sm mt-8">${e.sets.filter(s=>s.done).map(s=>setSummary(e,s)).join(' · ')||'No completed sets'}</div></div>`).join('')}
        <button class="btn btn-danger btn-block mt-16" id="delWorkout">Delete Workout</button>`);
      document.getElementById('shClose').onclick = AK.Sheet.close;
      document.getElementById('ceEdit').onclick = () => viewWorkout(id, true);
      document.getElementById('delWorkout').onclick = () => {
        if (confirm('Delete this workout permanently?')) {
          AK.state.workouts = AK.state.workouts.filter(x=>x.id!==id);
          AK.save();
          if (w.xpEarned) AK.Game.removeXp(w.xpEarned, 'Workout removed');
          AK.Sheet.close(); render(); AK.UI.refreshHome();
        }
      };
      return;
    }
    // Edit mode: adjust the name and each completed set's numbers. Sets aren't
    // added/removed here (that would need to re-derive XP) — just corrected.
    AK.Sheet.open(`<div class="sheet-head"><h3>Edit Workout</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="field"><label>Name</label><input class="input" id="ewName" value="${AK.escapeHtml(w.name)}"></div>
      ${w.exercises.map((e,ei)=>`<div class="card" style="margin-bottom:10px"><b>${AK.escapeHtml(e.name)}</b>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        ${e.sets.filter(s=>s.done).map((s,si)=>{
          const type = e.type||'weighted';
          if (type==='timed') return `<div class="flex items-center gap-8"><span class="text-2 text-sm" style="width:20px">${si+1}</span><input class="input" style="padding:7px" inputmode="numeric" data-ew-field="seconds" data-ew-ex="${ei}" data-ew-set="${si}" value="${s.seconds||0}"><span class="text-2 text-sm">sec</span></div>`;
          if (type==='reps') return `<div class="flex items-center gap-8"><span class="text-2 text-sm" style="width:20px">${si+1}</span><input class="input" style="padding:7px" inputmode="numeric" data-ew-field="reps" data-ew-ex="${ei}" data-ew-set="${si}" value="${s.reps||0}"><span class="text-2 text-sm">reps</span></div>`;
          return `<div class="flex items-center gap-8"><span class="text-2 text-sm" style="width:20px">${si+1}</span><input class="input" style="padding:7px" inputmode="decimal" data-ew-field="weight" data-ew-ex="${ei}" data-ew-set="${si}" value="${s.weight||0}"><span class="text-2 text-sm">kg ×</span><input class="input" style="padding:7px" inputmode="numeric" data-ew-field="reps" data-ew-ex="${ei}" data-ew-set="${si}" value="${s.reps||0}"></div>`;
        }).join('') || `<span class="text-2 text-sm">No completed sets</span>`}
        </div></div>`).join('')}
      <button class="btn btn-primary btn-block mt-8" id="saveEditWorkout">Save changes</button>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    document.getElementById('saveEditWorkout').onclick = () => {
      w.name = document.getElementById('ewName').value.trim() || w.name;
      AK.Sheet.body().querySelectorAll('[data-ew-field]').forEach(inp=>{
        const ex = w.exercises[inp.dataset.ewEx];
        const doneSets = ex.sets.filter(s=>s.done);
        const s = doneSets[inp.dataset.ewSet];
        if (s) s[inp.dataset.ewField] = parseFloat(inp.value)||0;
      });
      AK.save(); AK.toast('Workout updated','good'); AK.Sheet.close(); render(); AK.UI.refreshHome();
    };
  }
  function openTemplateBuilder(){
    let days = [{label:'Day 1', exercisesText:''}];
    function draw(nameVal){
      AK.Sheet.open(`<div class="sheet-head"><h3>New Routine</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div class="field"><label>Routine name</label><input class="input" id="tplName" placeholder="e.g. My Push Pull Legs" value="${AK.escapeHtml(nameVal||'')}"></div>
        <div id="tplDaysWrap" style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
          ${days.map((d,i)=>`<div class="card" style="padding:14px 16px">
            <div class="flex items-center justify-between gap-8">
              <input class="input" data-day-label="${i}" value="${AK.escapeHtml(d.label)}" style="font-weight:700;flex:1">
              ${days.length>1?`<button class="btn-icon" style="width:32px;height:32px;flex-shrink:0" data-day-del="${i}"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-x"/></svg></button>`:''}
            </div>
            <div class="field mt-8" style="margin-bottom:0"><label>Exercises (comma-separated)</label><input class="input" data-day-ex="${i}" placeholder="e.g. Barbell Back Squat, Leg Press, Calf Raise" value="${AK.escapeHtml(d.exercisesText)}"></div>
          </div>`).join('')}
        </div>
        <button class="btn btn-ghost btn-block mt-16" id="addDayBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg> Add day</button>
        <button class="btn btn-primary btn-block mt-16" id="saveTplBtn">Save Routine</button>`);
      document.getElementById('shClose').onclick = AK.Sheet.close;
      const sync = () => {
        AK.Sheet.body().querySelectorAll('[data-day-label]').forEach(inp=>{ days[inp.dataset.dayLabel].label = inp.value; });
        AK.Sheet.body().querySelectorAll('[data-day-ex]').forEach(inp=>{ days[inp.dataset.dayEx].exercisesText = inp.value; });
      };
      document.getElementById('addDayBtn').onclick = () => { sync(); days.push({label:'Day '+(days.length+1), exercisesText:''}); draw(document.getElementById('tplName').value); };
      AK.Sheet.body().querySelectorAll('[data-day-del]').forEach(b=>b.addEventListener('click',()=>{
        sync(); days.splice(parseInt(b.dataset.dayDel),1); draw(document.getElementById('tplName').value);
      }));
      document.getElementById('saveTplBtn').onclick = () => {
        sync();
        const name = document.getElementById('tplName').value.trim();
        if (!name) { AK.toast('Give your routine a name','bad'); return; }
        const cleanDays = days.map(d=>({ label:(d.label||'Day').trim()||'Day', exercises: d.exercisesText.split(',').map(s=>s.trim()).filter(Boolean) })).filter(d=>d.exercises.length);
        if (!cleanDays.length) { AK.toast('Add at least one exercise','bad'); return; }
        AK.state.templates.push({ name, tags:['Custom'], days: cleanDays });
        AK.save();
        AK.Sheet.close();
        AK.toast('Routine saved','good');
        render();
      };
    }
    draw('');
  }

  return { render, hasActiveSession: () => !!activeSession, startSession, openDayPicker };
})();
</script>

<script>
/* ====================================================================
   WATER MODULE
   ==================================================================== */
AK.Water = (() => {
  const PRESETS = [
    {label:'Glass', ml:250, icon:'i-glass'}, {label:'Bottle', ml:500, icon:'i-bottle'},
    {label:'Large Bottle', ml:1000, icon:'i-jug'}, {label:'Mug', ml:200, icon:'i-mug'}
  ];
  function todayRec(){
    const d = AK.today();
    if (!AK.state.water[d]) AK.state.water[d] = {entries:[]};
    return AK.state.water[d];
  }
  function totalFor(dateKey){ return (AK.state.water[dateKey]?.entries||[]).reduce((a,e)=>a+e.ml,0); }

  function render(){
    const el = document.getElementById('screen-water');
    const rec = todayRec();
    const total = totalFor(AK.today());
    const goal = AK.state.waterGoalMl;
    const pct = total/goal;
    const last7 = last7Days();
    el.innerHTML = `
      <h1 class="page-title">Water</h1>
      <p class="page-sub">Hydration you'll actually keep up with.</p>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;padding:28px 16px">
        ${AK.Fx.ringSvg(pct, 160, 14, '--water', `<div class="mono" style="font-size:28px;font-weight:700">${total}<span style="font-size:14px;color:var(--text-2)">ml</span></div><div class="text-2 text-sm">of ${goal}ml goal</div>`)}
        <div class="chipset mt-16" style="justify-content:center">
          ${PRESETS.map(p=>`<button class="chip" data-add="${p.ml}"><svg class="icon" viewBox="0 0 24 24"><use href="#${p.icon}"/></svg>+${p.ml}ml</button>`).join('')}
          <button class="chip" id="customAdd"><svg class="icon" viewBox="0 0 24 24"><use href="#i-edit"/></svg>Custom</button>
        </div>
      </div>

      <div class="section-title">Last 7 days</div>
      <div class="card">
        <div style="display:flex;align-items:flex-end;gap:8px;height:90px">
          ${last7.map(d=>{
            const h = AK.clamp(d.total/goal,0,1.2)*80;
            const hit = d.total>=goal;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
              <div style="width:100%;max-width:22px;height:${Math.max(h,3)}px;background:${hit?'var(--good)':'var(--water)'};border-radius:6px 6px 2px 2px"></div>
              <div class="text-2" style="font-size:9px;margin-top:6px">${d.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section-title">Today's log</div>
      ${rec.entries.length===0 ? `<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><use href="#i-droplet"/></svg><div>Nothing logged yet today</div></div>` :
        rec.entries.slice().reverse().map(e=>`<div class="card flex items-center justify-between" style="padding:12px 16px">
          <span class="flex items-center gap-8"><svg class="icon" viewBox="0 0 24 24" style="color:var(--water)"><use href="#i-droplet"/></svg>${e.ml}ml <span class="text-2 text-sm">· ${new Date(e.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></span>
          <span class="flex items-center gap-8">
            <button class="btn-icon" style="width:32px;height:32px" data-edit="${e.id}"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-edit"/></svg></button>
            <button class="btn-icon" style="width:32px;height:32px" data-del="${e.id}"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-trash"/></svg></button>
          </span>
        </div>`).join('')}

      <div class="section-title">Goal</div>
      <div class="card flex items-center justify-between">
        <span>Daily target</span>
        <div class="stepper" style="width:160px">
          <button data-goal="-100">−</button><input id="goalInput" value="${goal}"><button data-goal="100">+</button>
        </div>
      </div>
    `;
    el.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addWater(parseInt(b.dataset.add))));
    el.querySelector('#customAdd').addEventListener('click', () => {
      const v = prompt('Amount in ml:'); if (v && !isNaN(v)) addWater(parseInt(v));
    });
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      const entry = rec.entries.find(e=>e.id===b.dataset.del);
      rec.entries = rec.entries.filter(e=>e.id!==b.dataset.del);
      AK.save();
      if (entry) AK.Game.removeXp(entry.xp||2, 'Entry removed');
      render(); AK.UI.refreshHome();
    }));
    el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
      const entry = rec.entries.find(e=>e.id===b.dataset.edit);
      if (!entry) return;
      const v = prompt('Amount in ml:', entry.ml);
      if (v==null) return;
      const n = parseInt(v);
      if (!n || n<=0) { AK.toast('Enter a valid amount','bad'); return; }
      entry.ml = n;
      AK.save(); render(); AK.UI.refreshHome();
    }));
    const gi = el.querySelector('#goalInput');
    el.querySelectorAll('[data-goal]').forEach(b=>b.addEventListener('click',()=>{
      AK.state.waterGoalMl = AK.clamp(AK.state.waterGoalMl + parseInt(b.dataset.goal), 250, 10000);
      AK.save(); render();
    }));
  }
  function addWater(ml){
    const rec = todayRec();
    rec.entries.push({id:AK.uid(), ts:Date.now(), ml, xp:2});
    AK.save(); AK.haptic(10);
    AK.Game.updateStreak();
    AK.Game.addXp(2,'Hydration');
    const total = totalFor(AK.today());
    if (total>=AK.state.waterGoalMl && total-ml<AK.state.waterGoalMl) { AK.toast('Water goal hit!','good'); AK.Fx.confettiBurst(); checkWaterStreak(); }
    render();
    AK.UI.refreshHome();
  }
  function checkWaterStreak(){
    const days = last7Days();
    if (days.filter(d=>d.total>=AK.state.waterGoalMl).length>=7) AK.Achievements.unlock('water7');
  }
  function last7Days(){
    const out=[];
    for (let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = AK.fmtDate(d);
      out.push({label:d.toLocaleDateString(undefined,{weekday:'narrow'}), total: totalFor(key)});
    }
    return out;
  }
  function quickAddSheet(){
    AK.Sheet.open(`<div class="sheet-head"><h3>Add Water</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="chipset">${PRESETS.map(p=>`<button class="chip" data-add="${p.ml}"><svg class="icon" viewBox="0 0 24 24"><use href="#${p.icon}"/></svg>+${p.ml}ml</button>`).join('')}</div>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    AK.Sheet.body().querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{ addWater(parseInt(b.dataset.add)); AK.Sheet.close(); }));
  }
  return { render, quickAddSheet, totalFor, todayRec };
})();
</script>

<script>
/* ====================================================================
   ACTIVITY — lightweight cross-training log for anything that isn't
   barbell/gym work (running, cycling, football, cricket, swimming, yoga,
   etc). Deliberately NOT trying to be a full sport-specific tracker for
   every sport — this app's depth stays with strength training, where the
   XP/rank system and exercise library actually add value. This just makes
   sure "leg day, then five-a-side on Saturday" both count toward the same
   streak/XP instead of one being invisible to the app.
   ==================================================================== */
AK.Activity = (() => {
  const TYPES = [
    {key:'run', label:'Running', met:9.8, hasDistance:true}, {key:'cycle', label:'Cycling', met:7.5, hasDistance:true},
    {key:'football', label:'Football', met:8, hasDistance:false}, {key:'cricket', label:'Cricket', met:5, hasDistance:false},
    {key:'swim', label:'Swimming', met:8, hasDistance:true}, {key:'basketball', label:'Basketball', met:6.5, hasDistance:false},
    {key:'yoga', label:'Yoga / Mobility', met:3, hasDistance:false}, {key:'other', label:'Type your own…', met:6, hasDistance:true, custom:true},
  ];
  const INTENSITY = [ {key:'easy', label:'Easy'}, {key:'moderate', label:'Moderate'}, {key:'hard', label:'Hard'} ];

  function xpFor(durationMin, intensity){
    const mult = intensity==='hard' ? 1.3 : intensity==='easy' ? 0.7 : 1;
    return Math.max(5, Math.round(durationMin * 0.6 * mult));
  }
  // Standard MET-based estimate: kcal = MET * 3.5 * weightKg / 200 * minutes
  function caloriesFor(typeKey, durationMin, intensity, weightKg){
    const t = TYPES.find(x=>x.key===typeKey) || {met:6};
    const iMult = intensity==='hard' ? 1.15 : intensity==='easy' ? 0.85 : 1;
    const w = weightKg || AK.currentWeightKg();
    return Math.max(1, Math.round(t.met * iMult * 3.5 * w / 200 * durationMin));
  }
  function typeLabel(key, customName){ if (key==='other' && customName) return customName; return (TYPES.find(t=>t.key===key)||{}).label || 'Activity'; }
  function recent(limit=5){ return [...AK.state.activities].sort((a,b)=>b.ts-a.ts).slice(0,limit); }

  function logSheet(editId){
    const editing = editId ? AK.state.activities.find(a=>a.id===editId) : null;
    let typeKey = editing ? editing.type : TYPES[0].key, intensityKey = editing ? editing.intensity : 'moderate';
    AK.Sheet.open(`<div class="sheet-head"><h3>${editing?'Edit':'Log'} Activity</h3><button class="btn-icon" id="shClose"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
      <div class="field"><label>Activity</label>
        <div class="chipset" id="actTypeChips">${TYPES.map(t=>`<button class="chip ${t.key===typeKey?'active':''}" data-type="${t.key}"><svg class="icon" viewBox="0 0 24 24"><use href="#i-run"/></svg>${t.label}</button>`).join('')}</div>
      </div>
      <div class="field" id="actCustomWrap" style="display:${typeKey==='other'?'block':'none'}"><label>Sport name</label><input class="input" id="actCustomName" placeholder="e.g. Badminton" value="${editing&&editing.customName?AK.escapeHtml(editing.customName):''}"></div>
      <div class="grid-2">
        <div class="field"><label>Duration (min)</label><input class="input" id="actDuration" inputmode="numeric" placeholder="30" value="${editing?editing.durationMin:''}"></div>
        <div class="field" id="actDistanceWrap" style="display:${(TYPES.find(t=>t.key===typeKey)||{}).hasDistance?'block':'none'}"><label>Distance (km, optional)</label><input class="input" id="actDistance" inputmode="decimal" placeholder="—" value="${editing&&editing.distanceKm?editing.distanceKm:''}"></div>
      </div>
      <div class="field"><label>Intensity</label>
        <div class="chipset" id="actIntensityChips">${INTENSITY.map(i=>`<button class="chip ${i.key===intensityKey?'active':''}" data-intensity="${i.key}">${i.label}</button>`).join('')}</div>
      </div>
      <div class="field"><label>Note (optional)</label><input class="input" id="actNote" placeholder="e.g. 5-a-side with friends" value="${editing&&editing.note?AK.escapeHtml(editing.note):''}"></div>
      <p class="text-2 text-sm" id="actCalPreview" style="margin:2px 0 4px"></p>
      <button class="btn btn-primary btn-block" id="saveActBtn">${editing?'Save changes':'Save Activity'}</button>`);
    document.getElementById('shClose').onclick = AK.Sheet.close;
    function refreshCalPreview(){
      const d = parseInt(document.getElementById('actDuration').value)||0;
      const cal = d>0 ? caloriesFor(typeKey, d, intensityKey) : 0;
      document.getElementById('actCalPreview').textContent = cal ? `≈ ${cal} kcal burned at your current weight` : '';
    }
    document.getElementById('actTypeChips').querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{
      typeKey=b.dataset.type; document.querySelectorAll('#actTypeChips .chip').forEach(c=>c.classList.toggle('active',c.dataset.type===typeKey));
      document.getElementById('actCustomWrap').style.display = typeKey==='other' ? 'block' : 'none';
      document.getElementById('actDistanceWrap').style.display = (TYPES.find(t=>t.key===typeKey)||{}).hasDistance ? 'block' : 'none';
      refreshCalPreview();
    }));
    document.getElementById('actIntensityChips').querySelectorAll('[data-intensity]').forEach(b=>b.addEventListener('click',()=>{
      intensityKey=b.dataset.intensity; document.querySelectorAll('#actIntensityChips .chip').forEach(c=>c.classList.toggle('active',c.dataset.intensity===intensityKey));
      refreshCalPreview();
    }));
    document.getElementById('actDuration').addEventListener('input', refreshCalPreview);
    refreshCalPreview();
    document.getElementById('saveActBtn').onclick = () => {
      const duration = parseInt(document.getElementById('actDuration').value)||0;
      if (duration<=0){ AK.toast('Add a duration first','bad'); return; }
      const distance = parseFloat(document.getElementById('actDistance').value)||null;
      const note = document.getElementById('actNote').value.trim();
      const customName = typeKey==='other' ? document.getElementById('actCustomName').value.trim() : null;
      if (typeKey==='other' && !customName){ AK.toast('Type the sport name first','bad'); return; }
      const calories = caloriesFor(typeKey, duration, intensityKey);
      if (editing){
        if (editing.xp) AK.Game.removeXp(editing.xp, 'Activity edited');
        const xp = xpFor(duration, intensityKey);
        Object.assign(editing, { type:typeKey, customName, durationMin:duration, intensity:intensityKey, distanceKm:distance, note, xp, calories });
        AK.save();
        AK.Game.addXp(xp, typeLabel(typeKey, customName));
        AK.toast('Activity updated','good');
      } else {
        const xp = xpFor(duration, intensityKey);
        AK.state.activities.push({ id:AK.uid(), date:AK.today(), ts:Date.now(), type:typeKey, customName, durationMin:duration, intensity:intensityKey, distanceKm:distance, note, xp, calories });
        AK.save();
        AK.Game.updateStreak();
        AK.Game.addXp(xp, typeLabel(typeKey, customName));
        if (AK.state.activities.length===5) AK.Achievements.unlock('cross_train');
        AK.toast(typeLabel(typeKey, customName)+' logged','good');
      }
      AK.Sheet.close();
      AK.UI.refreshHome();
      if (document.getElementById('screen-workout').classList.contains('active') && !AK.Workout.hasActiveSession()) AK.Workout.render();
    };
  }

  function historyList(limit=5){
    const list = recent(limit);
    if (!list.length) return '';
    return `<div class="section-title">Other Activity</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${list.map(a=>`<div class="card flex items-center justify-between" style="padding:12px 16px">
          <span class="flex items-center gap-8"><svg class="icon" viewBox="0 0 24 24" style="color:var(--rank-a)"><use href="#i-run"/></svg><b>${AK.escapeHtml(typeLabel(a.type,a.customName))}</b> <span class="text-2 text-sm">· ${a.durationMin} min${a.distanceKm?' · '+AK.round1(a.distanceKm)+'km':''}${a.calories?' · '+a.calories+' kcal':''}</span></span>
          <span class="flex items-center gap-8">
            <button class="btn-icon" style="width:30px;height:30px" data-edit-act="${a.id}"><svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><use href="#i-edit"/></svg></button>
            <button class="btn-icon" style="width:30px;height:30px" data-del-act="${a.id}"><svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><use href="#i-trash"/></svg></button>
          </span>
        </div>`).join('')}
      </div>`;
  }
  function bindHistory(el){
    el.querySelectorAll('[data-edit-act]').forEach(b=>b.addEventListener('click',()=>logSheet(b.dataset.editAct)));
    el.querySelectorAll('[data-del-act]').forEach(b=>b.addEventListener('click',()=>{
      if (!confirm('Delete this activity entry?')) return;
      const a = AK.state.activities.find(x=>x.id===b.dataset.delAct);
      AK.state.activities = AK.state.activities.filter(x=>x.id!==b.dataset.delAct);
      AK.save();
      if (a && a.xp) AK.Game.removeXp(a.xp, 'Activity removed');
      AK.UI.refreshHome();
      AK.Workout.render();
    }));
  }
  return { TYPES, logSheet, recent, historyList, bindHistory, typeLabel, caloriesFor };
})();
</script>

<script>
/* ====================================================================
   BODY MODULE — metrics + progress photos (photos stored in IndexedDB only)
   ==================================================================== */
AK.Body = (() => {
  let tab = 'impact';
  const GOAL_LABEL = AK.GOAL_LABELS;
  const GOAL_MUSCLE_FOCUS = { strength:['quads','chest','back'], endurance:['cardio'], sixpack:['abs','cardio'], fatloss:['cardio','quads'], consistency:['quads','chest','back'], weight:['cardio','quads'] };
  const ZONES = [
    {key:'shoulders', label:'Shoulders', muscles:['shoulders'], rects:[{x:44,y:58,w:34,h:26},{x:122,y:58,w:34,h:26}]},
    {key:'chest', label:'Chest', muscles:['chest'], rects:[{x:62,y:86,w:76,h:38}]},
    {key:'abs', label:'Abs / Core', muscles:['abs'], rects:[{x:74,y:128,w:52,h:56}]},

  function heatColor(pct){
    const p = AK.clamp(pct,0,100)/100;
    const r = Math.round(71 + p*(239-71)), g = Math.round(85 + p*(68-85)), b = Math.round(105 + p*(68-105));
    return `rgb(${r},${g},${b})`;
  }
  function muscleVolume7d(){
    const cutoff = Date.now() - 7*86400000;
    const vol = {};
    AK.state.workouts.forEach(w=>{
      if (!w.startedAt || w.startedAt < cutoff) return;
      w.exercises.forEach(e=>{
        if (!e.muscle) return;
        const doneCount = e.sets.filter(s=>s.done).length;
        if (!doneCount) return;
        vol[e.muscle] = (vol[e.muscle]||0) + doneCount;
      });
    });
    return vol;
  }
  function render(){

      </div>
      <div id="bodyTabBody" class="mt-16"></div>
    `;
    el.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; render(); }));
    const body = document.getElementById('bodyTabBody');
    if (tab==='impact') renderImpact(body);
    else if (tab==='photos') renderPhotos(body);
    else if (tab==='metrics') renderMetrics(body);
    else renderSleep(body);
  }

  /* ---------- Impact: 2D body heatmap scaled to height/weight ---------- */
  function renderImpact(body){
    const vol = muscleVolume7d();
    const heightCm = AK.currentHeightCm(), weightKg = AK.currentWeightKg();
    const bmi = weightKg / Math.pow(heightCm/100,2);

    const widthScale = AK.clamp(0.82 + (bmi-22)/22*0.55, 0.75, 1.4);
    const zonePct = {};
    ZONES.forEach(z=>{ const sum=z.muscles.reduce((a,m)=>a+(vol[m]||0),0); zonePct[z.key] = AK.clamp(Math.round(sum/(12*z.muscles.length)*100),0,100); });
    const posterior = ['back','hamstrings','glutes'].map(m=>({key:m, label:AK.MUSCLE_LABEL[m], pct:AK.clamp(Math.round((vol[m]||0)/12*100),0,100)}));
    const cardioSets = vol.cardio||0;
    const weeklyStrengthCal = AK.state.workouts.filter(w=>w.startedAt>Date.now()-7*86400000).reduce((a,w)=>a+w.exercises.reduce((a2,e)=>a2+e.sets.filter(s=>s.done).length,0)*6,0);
    const weeklyActivityCal = AK.state.activities.filter(a=>a.ts>Date.now()-7*86400000).reduce((a,x)=>a+(x.calories||0),0);
    const totalWeeklyCal = weeklyStrengthCal + weeklyActivityCal;
    const svgZones = ZONES.map(z=>z.rects.map(r=>`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10" fill="${heatColor(zonePct[z.key])}" data-zone="${z.key}" style="cursor:pointer;transition:fill .3s"/>`).join('')).join('');

    body.innerHTML = `
      <div class="card" style="padding:14px 8px 4px">
        <div class="flex items-center justify-between" style="padding:0 10px">
          <div><div class="text-2 text-sm">Height</div><b>${heightCm} cm</b></div>
          <div><div class="text-2 text-sm">Weight</div><b>${AK.round1(weightKg)} kg</b></div>

        </div>
        <svg viewBox="0 0 200 380" style="width:100%;max-width:220px;display:block;margin:8px auto">

            <circle cx="100" cy="34" r="24" fill="var(--surface-hi)" stroke="var(--border-hi)"/>
            <rect x="90" y="54" width="20" height="18" fill="var(--surface-hi)"/>
            ${svgZones}
          </g>
        </svg>
        <p class="text-2 text-sm" style="text-align:center;padding:0 14px 12px">Scaled to your logged height &amp; weight. Tap a zone — redder means more recently trained.</p>
      </div>
      <div id="zoneDetail" class="text-2 text-sm" style="min-height:20px;text-align:center;margin:8px 0"></div>

      <div class="section-title">Posterior chain <span class="text-2 text-sm" style="font-weight:400">(back of body, not pictured)</span></div>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        ${posterior.map(p=>`<div>
          <div class="flex items-center justify-between text-sm"><span>${p.label}</span><span class="text-2">${p.pct}%</span></div>
          <div style="height:6px;border-radius:99px;background:var(--surface-hi);margin-top:4px;overflow:hidden"><div style="height:100%;width:${p.pct}%;background:${heatColor(p.pct)};border-radius:99px"></div></div>
        </div>`).join('')}
      </div>

      <div class="section-title">This week's impact</div>
      <div class="grid-2">
        <div class="card" style="text-align:center"><div class="text-2 text-sm">Est. calories burned</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px">${totalWeeklyCal}</div></div>
        <div class="card" style="text-align:center"><div class="text-2 text-sm">Cardio sets logged</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px">${cardioSets}</div></div>

      <div id="suggestBlock"></div>

    body.querySelectorAll('[data-zone]').forEach(r=>r.addEventListener('click',()=>{
      const key = r.dataset.zone;

  function renderSuggestion(el, vol){
    const goal = (AK.state.profile && AK.state.profile.goal) || 'strength';

  function convertWeight(kg, unit){ return unit==='lb' ? kg*2.2046 : kg; }
  function sparkline(list){
    const pts = [...list].reverse().filter(m=>m.weightKg).slice(-14);
    if (pts.length<2) return '<div class="text-2 text-sm">Log more entries to see a trend line</div>';
    const vals = pts.map(p=>p.weightKg);
    const min = Math.min(...vals), max = Math.max(...vals) || min+1;
    const w=280,h=60;
    const path = pts.map((p,i)=>{
      const x = (i/(pts.length-1))*w;
      const y = h - ((p.weightKg-min)/((max-min)||1))*h;
      return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px"><path d="${path}" fill="none" stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
